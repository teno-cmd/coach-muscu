<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Muscu">
<meta name="theme-color" content="#0a0a0c">
<title>Coach Muscu</title>
<style>
:root{--bg:#0a0a0c;--s1:#141418;--s2:#1c1c22;--s3:#272730;--line:#2a2a33;--fg:#f3f3f6;--mu:#8d8d9a;--ac:#d4ff3a;--acd:rgba(212,255,58,.13);--ok:#3ee08f;--red:#ff4d6d;--r:18px;
--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{min-height:100dvh;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;-webkit-user-select:text;user-select:text}
input:focus{outline:2px solid var(--ac);outline-offset:-1px}
a{color:var(--ac)}
#app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 100px)}
#app.wk{padding-bottom:calc(var(--sb) + 150px)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}
.brand{font-weight:900;letter-spacing:.14em;font-size:12px;color:var(--mu)}
.brand b{color:var(--ac)}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mu);font-weight:700;margin:24px 0 10px}
p+p{margin-top:8px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.hero{background:linear-gradient(155deg,#1f2408 0%,#141418 62%);border-color:#3b4416}
.muted{color:var(--mu)}.small{font-size:13px}.tiny{font-size:11px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:16px;font-weight:800;font-size:17px;background:var(--ac);color:#0a0a0c;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--s2);color:var(--fg);border:1px solid var(--line)}
.btn.red{background:rgba(255,77,109,.14);color:var(--red);border:1px solid rgba(255,77,109,.3)}
.btn.sm{padding:10px 14px;font-size:14px;width:auto;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s2);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
.stat span{font-size:12px;color:var(--mu)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--s3);color:var(--mu);white-space:nowrap}
.tag.ac{background:var(--acd);color:var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mt{margin-top:12px}.mt2{margin-top:20px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(10,10,12,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 0 calc(var(--sb) + 6px);z-index:20}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);font-weight:600;padding:4px 14px;min-width:64px}
nav.tabs button.on{color:var(--ac)}
nav.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-bottom:6px}
.seg{display:flex;background:var(--s2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#0a0a0c}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--s2);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px}
.opt.on{border-color:var(--ac);background:var(--acd)}
.opt .em{font-size:26px}
.opt b{display:block;font-size:16px}
.opt span{font-size:13px;color:var(--mu)}
/* list */
.exrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.exrow:first-child{border-top:0}
.exrow .th{width:52px;height:42px;flex:none;background:var(--s2);border-radius:10px}
.exrow b{font-size:15px;display:block;line-height:1.25}
.exrow small{color:var(--mu);font-size:12.5px}
.chev{color:var(--mu);font-size:20px}
.daycard.next{border-color:#3b4416}
/* figure */
svg.fig{display:block;width:100%;height:auto}
svg.fig .b{stroke:var(--fg);stroke-width:7;stroke-linecap:round;fill:none}
svg.fig .b2{stroke:#6d6d79;stroke-width:6;stroke-linecap:round;fill:none}
svg.fig .hd{fill:var(--fg)}
svg.fig .eq{stroke:#4b4b57;stroke-linecap:round;fill:none}
svg.fig .gr{stroke:#2e2e38;stroke-width:2}
svg.fig .cb{stroke:var(--ac);stroke-width:1.6;stroke-dasharray:4 3;opacity:.75}
svg.fig .pl{fill:#0a0a0c;stroke:var(--ac);stroke-width:3}
svg.fig .pd{fill:#4b4b57}
.figbox{background:radial-gradient(circle at 50% 40%,#1b1e10,#121215 70%);border-radius:16px;border:1px solid var(--line);padding:6px}
/* workout */
.wkhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.xbtn{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;font-size:18px;flex:none}
.prog{height:6px;background:var(--s3);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .4s}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 11px 7px 7px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mu);max-width:180px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip i{width:22px;height:22px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800;flex:none;color:var(--fg)}
.chip.cur{border-color:var(--ac);color:var(--fg)}
.chip.cur i{background:var(--ac);color:#0a0a0c}
.chip.done i{background:var(--ok);color:#0a0a0c}
.target{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.target div{background:var(--s2);border-radius:12px;padding:9px 6px;text-align:center}
.target b{display:block;font-size:17px;font-weight:800}
.target span{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.set{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;padding:8px;border-radius:14px;margin-top:6px;background:var(--s2);border:1.5px solid transparent;transition:background .2s}
.set.cur{border-color:var(--ac)}
.set.done{background:rgba(62,224,143,.09)}
.set .sn{font-weight:800;color:var(--mu);text-align:center}
.stp{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:10px;height:44px}
.stp button{width:36px;height:44px;font-size:20px;color:var(--mu);font-weight:600}
.stp span{font-weight:800;font-size:16px;white-space:nowrap}
.stp span small{font-weight:600;color:var(--mu);font-size:11px;margin-left:2px}
.chk{width:48px;height:44px;border-radius:12px;background:var(--s3);font-size:20px;color:var(--mu);font-weight:900}
.set.done .chk{background:var(--ok);color:#0a0a0c}
.set.done .sn{color:var(--ok)}
.setlbl{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;padding:0 8px;margin-top:14px;text-align:center}
.cta{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(var(--sb) + 12px);background:linear-gradient(transparent,var(--bg) 30%);z-index:15}
.cta>div{max-width:528px;margin:0 auto}
.restpill{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-bottom:8px;padding:11px;border-radius:14px;background:var(--s2);border:1px solid var(--ac);font-weight:700;font-size:15px}
.restpill b{color:var(--ac);font-size:18px;font-variant-numeric:tabular-nums}
.restpill.go{background:var(--ac);color:#0a0a0c}.restpill.go b{color:#0a0a0c}
.lastinfo{font-size:13px;color:var(--mu);margin-top:10px;padding:10px 12px;background:var(--s2);border-radius:12px}
.lastinfo b{color:var(--fg)}
/* rest overlay */
.rest{position:fixed;inset:0;z-index:40;background:rgba(6,6,8,.96);display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px)}
.rest-in{width:100%;max-width:420px;text-align:center}
.ringw{position:relative;width:min(74vw,290px);margin:14px auto 10px}
.ring{width:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .rb{stroke:var(--s3)}
.ring .rf{stroke:var(--ac);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.rest-t small{font-size:13px;color:var(--mu);font-weight:600;letter-spacing:.1em}
.rest-lbl{font-size:15px;color:var(--mu);margin-bottom:22px;min-height:22px}
.rest-lbl b{color:var(--fg)}
.rest.go{background:var(--ac)}
.rest.go .rest-t,.rest.go .rest-lbl,.rest.go .rest-lbl b,.rest.go .muted{color:#0a0a0c}
.rest.go .btn:not(.ghost){background:#0a0a0c;color:var(--ac)}
.rest.go .rest-t small{color:rgba(0,0,0,.6)}
.rest.go .ring .rb{stroke:rgba(0,0,0,.15)}.rest.go .ring .rf{stroke:#0a0a0c}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.rest.go .ringw{animation:pulse .5s ease 3}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.6)}
.sheet-body{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow-y:auto;background:var(--s1);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 18px calc(var(--sb) + 20px);animation:up .25s ease;max-width:560px;margin:0 auto;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--s3);margin:0 auto 14px}
ul.cues{list-style:none;margin-top:6px}
ul.cues li{padding:7px 0 7px 28px;position:relative;font-size:15px;border-top:1px solid var(--line)}
ul.cues li:first-child{border-top:0}
ul.cues li:before{content:"✓";position:absolute;left:4px;color:var(--ok);font-weight:900}
ul.cues.bad li:before{content:"✕";color:var(--red)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:var(--ac);color:#0a0a0c;font-weight:800;padding:11px 18px;border-radius:999px;z-index:60;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:up .2s}
details summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:700}
details summary::-webkit-details-marker{display:none}
details summary:after{content:"+";color:var(--mu);font-size:22px;font-weight:400}
details[open] summary:after{content:"−"}
.sci p{font-size:14px;color:#c9c9d2}
.sci .rt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.sci .rt b.t{background:var(--acd);color:var(--ac);border-radius:9px;padding:4px 8px;font-size:14px;text-align:center;min-width:56px}
.hist .hx{font-size:13px;color:var(--mu);padding:6px 0;border-top:1px solid var(--line)}
.hist .hx b{color:var(--fg);font-weight:600}
.switch{width:50px;height:30px;border-radius:99px;background:var(--s3);position:relative;flex:none;transition:.2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--ok)}.switch.on:after{left:23px}
.setting{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0}
.vol{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.vol .bar{flex:1;margin:0 10px;height:6px;align-self:center;background:var(--s3);border-radius:9px;overflow:hidden}
.vol .bar i{display:block;height:100%;background:var(--ac)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="nav"></nav>
<div class="sheet" id="sheet"><div class="sheet-bg" data-a="closeSheet"></div><div class="sheet-body" id="sheetBody"></div></div>

<script>
'use strict';
/* =========================================================
   COACH MUSCU — PWA mono-fichier
   Données : localStorage (clé KEY). Aucune dépendance externe.
   ========================================================= */
const KEY = 'coachmuscu_v1';

/* ---------- Groupes musculaires ---------- */
const MUS = {pecs:'Pectoraux',dos:'Dos',epaules:'Épaules',quads:'Quadriceps',ischios:'Ischios',fessiers:'Fessiers',mollets:'Mollets',biceps:'Biceps',triceps:'Triceps',abdos:'Abdos'};

/* ---------- Base d'exercices (matériel salles ON AIR) ----------
   t : H = polyarticulaire lourd, C = polyarticulaire machine/haltères, I = isolation, A = abdos
   u : unité de charge (barre = charge totale barre incluse, halt = par haltère, mach = machine, poulie, pdc = poids du corps)
   r : ratio de charge / poids de corps (homme intermédiaire), point de départ seulement
   p : animation (schéma du mouvement) */
const EX = {
 dc_barre:{n:'Développé couché barre',eq:'Banc plat + barre olympique',m:'pecs',t:'H',u:'barre',r:.8,p:'bench',
  c:['Omoplates serrées et abaissées, légère cambrure naturelle','Pieds bien ancrés au sol, fessiers sur le banc','Barre descend au bas des pectoraux, coudes à ~45–70° du buste','Pousse en légère diagonale vers les épaules, poignets droits'],
  e:['Coudes à 90° du buste (épaules en danger)','Rebond de la barre sur la poitrine']},
 chest_press:{n:'Chest press convergente',eq:'Machine Hammer Strength / Panatta / Technogym',m:'pecs',t:'C',u:'mach',r:.6,p:'seatedPress',
  c:['Règle le siège : poignées à hauteur du bas des pectoraux','Dos et omoplates plaqués contre le dossier','Pousse sans verrouiller complètement les coudes','Retour contrôlé (2 s) jusqu’à l’étirement des pecs'],
  e:['Épaules qui avancent en fin de poussée','Siège trop haut ou trop bas']},
 dc_incl_halt:{n:'Développé incliné haltères',eq:'Banc inclinable (30°) + haltères',m:'pecs',t:'C',u:'halt',r:.25,p:'inclinePress',
  c:['Banc à 30° maximum (au-delà, ce sont les épaules)','Omoplates serrées, poitrine sortie','Descends les haltères sur les côtés du haut des pecs','Pousse en rapprochant légèrement les haltères'],
  e:['Banc trop incliné','Haltères qui s’entrechoquent en haut (tension perdue)']},
 pec_fly_poulie:{n:'Écarté poulies vis-à-vis',eq:'Poulies vis-à-vis (cross-over)',m:'pecs',t:'I',u:'poulie',r:.12,p:'cableFly',
  c:['Poulies à hauteur d’épaules, un pied devant','Coudes légèrement fléchis et fixes','Rapproche les mains devant la poitrine en « enlaçant un arbre »','Laisse les pecs s’étirer au retour sans dépasser la ligne des épaules'],
  e:['Plier/tendre les coudes (devient un développé)','Charge trop lourde, buste qui bascule']},
 pec_deck:{n:'Pec deck (butterfly)',eq:'Machine butterfly Technogym',m:'pecs',t:'I',u:'mach',r:.4,p:'cableFly',
  c:['Poignées à hauteur de poitrine','Dos collé au dossier, omoplates serrées','Ferme en contractant fort 1 s','Retour lent jusqu’à l’étirement'],
  e:['Épaules qui roulent vers l’avant','Amplitude trop grande au retour']},
 dips_assist:{n:'Dips (assistés si besoin)',eq:'Barres parallèles / machine dips assistée',m:'pecs',t:'C',u:'pdc',r:0,p:'dip',
  c:['Buste légèrement penché en avant','Descends jusqu’à ce que les épaules soient au niveau des coudes','Épaules basses, loin des oreilles','Utilise l’assistance pour rester dans la fourchette de reps'],
  e:['Descendre trop bas (stress épaules)','Épaules qui remontent vers les oreilles']},
 tirage_vertical:{n:'Tirage vertical poulie haute',eq:'Poste de tirage (Technogym / Hammer Strength)',m:'dos',t:'C',u:'mach',r:.6,p:'pulldown',
  c:['Cuisses bloquées sous les boudins','Prise un peu plus large que les épaules','Tire les coudes vers les hanches, poitrine vers la barre','Remonte lentement jusqu’à l’étirement des dorsaux'],
  e:['Tirer derrière la nuque','Se balancer en arrière pour tricher']},
 tractions:{n:'Tractions (assistées si besoin)',eq:'Barre de traction / machine assistée',m:'dos',t:'C',u:'pdc',r:0,p:'pullup',
  c:['Départ bras tendus, épaules engagées (abaissées)','Monte la poitrine vers la barre en tirant les coudes vers le bas','Gainage abdos/fessiers, pas de balancement','Descente contrôlée jusqu’à extension complète'],
  e:['Demi-répétitions','Kipping / élan des jambes']},
 rowing_assis_poulie:{n:'Rowing assis poulie basse',eq:'Poulie basse + poignée triangle',m:'dos',t:'C',u:'poulie',r:.55,p:'row',
  c:['Genoux légèrement fléchis, buste droit','Tire la poignée vers le nombril','Serre les omoplates en fin de mouvement','Laisse les bras s’allonger et le dos s’étirer légèrement au retour'],
  e:['Dos qui s’arrondit','Balancer le buste d’avant en arrière']},
 rowing_machine:{n:'Rowing iso-latéral (plate-loaded)',eq:'Machine Hammer Strength / Panatta à disques',m:'dos',t:'C',u:'mach',r:.6,p:'row',
  c:['Poitrine contre le support','Tire les coudes vers l’arrière, près du corps','Pause 1 s omoplates serrées','Retour lent, étirement complet'],
  e:['Décoller la poitrine du support','Tirer avec les biceps (coudes qui s’écartent trop)']},
 rowing_barre:{n:'Rowing barre buste penché',eq:'Barre olympique',m:'dos',t:'H',u:'barre',r:.6,p:'bentRow',
  c:['Hanches en arrière, buste à ~45° ou plus penché, dos plat','Genoux légèrement fléchis, barre près des cuisses','Tire la barre vers le bas du ventre','Garde le buste immobile'],
  e:['Dos rond (risque lombaires)','Se redresser à chaque rep']},
 rowing_halt:{n:'Rowing haltère unilatéral',eq:'Banc plat + haltère',m:'dos',t:'C',u:'halt',r:.3,p:'bentRow',
  c:['Main et genou en appui sur le banc, dos plat','Tire l’haltère vers la hanche','Coude près du corps','Étire bien en bas sans tourner le buste'],
  e:['Rotation du tronc','Tirer vers l’épaule au lieu de la hanche']},
 pullover_poulie:{n:'Pull-over poulie haute bras tendus',eq:'Poulie haute + barre droite ou corde',m:'dos',t:'I',u:'poulie',r:.2,p:'straightPulldown',
  c:['Léger penché en avant, bras presque tendus','Ramène la barre vers les cuisses en arc de cercle','Contracte les dorsaux en bas','Remonte jusqu’à l’étirement'],
  e:['Plier les coudes (devient du triceps)','Bouger le buste']},
 dev_mil_halt:{n:'Développé militaire haltères assis',eq:'Banc à dossier droit + haltères',m:'epaules',t:'C',u:'halt',r:.2,p:'ohp',
  c:['Dossier vertical, dos collé','Haltères à hauteur des oreilles, coudes légèrement en avant','Pousse au-dessus de la tête sans claquer les haltères','Gainage : ne cambre pas excessivement'],
  e:['Hyper-cambrure lombaire','Descente trop courte']},
 shoulder_press_machine:{n:'Shoulder press machine',eq:'Machine Technogym / Hammer Strength',m:'epaules',t:'C',u:'mach',r:.45,p:'ohp',

/* ---------- Génération du programme ---------- */
function prescribe(id,i,p){
  const e=EX[id]; let sets,rmin,rmax;
  if(e.t==='H'){
    [rmin,rmax] = p.goal==='recompo'?[6,10]:[6,8];
    if(p.level==='deb'){rmin=8;rmax=10;sets=3}
    else sets = (p.level==='adv' || (p.goal==='masse' && i<2)) ? 4 : 3;
  } else if(e.t==='C'){rmin=8;rmax=12;sets=3+((p.level==='adv'&&p.goal!=='seche'&&i<3)?1:0)}
  else if(e.t==='I'){rmin=10;rmax=15;sets=p.level==='deb'?2:3}
  else {rmin=12;rmax=20;sets=p.level==='deb'?2:3}
  return {id,sets,rmin,rmax,rest:REST[e.t]};
}
function generate(p){
  const cap = ({deb:6,int:7,adv:8})[p.level] - (p.goal==='seche'?1:0);
  const days = PLANS[p.days].map(k=>{
    const t=TPL[k]; const ids=[];
    t.x.forEach(id=>{ if(p.level==='deb'&&BEG_SUB[id]) id=BEG_SUB[id]; if(!ids.includes(id)) ids.push(id); });
    return {k,n:t.n,f:t.f,ex:ids.slice(0,cap).map((id,i)=>prescribe(id,i,p))};
  });
  return {days,created:Date.now()};
}
function rir(){return ({deb:'2–3',int:'1–2',adv:'0–2'})[S.profile.level]}

function stepOf(id,w){const u=EX[id].u; if(u==='halt')return (w||0)>=20?2:1; if(id==='presse_cuisses'||id==='hack_squat')return 5; return 2.5}
function roundLoad(id,w){const u=EX[id].u; const st=u==='halt'?(w>=20?2:1):2.5; const r=Math.round(w/st)*st; const min={barre:20,halt:2,mach:5,poulie:2.5}[u]||2.5; return Math.max(min,+r.toFixed(1))}
function baseLoad(id){
  const e=EX[id],p=S.profile; if(e.u==='pdc')return null;
  const lv={deb:.5,int:.8,adv:1.05}[p.level], sx=p.sex==='F'?.62:1, ag=p.age>=55?.82:p.age>=45?.9:p.age<18?.8:1;
  return roundLoad(id,p.weight*e.r*lv*sx*ag);
}
function suggest(id){
  const L=S.last[id];
  if(EX[id].u==='pdc') return {w:null,why:'Poids du corps — utilise l’assistance de la machine si tu n’atteins pas la fourchette.'};
  if(!L||L.w==null) return {w:baseLoad(id),why:'Charge estimée d’après ton profil : ajuste-la dès la 1re série.'};
  if(L.allTop){const s=stepOf(id,L.w);return {w:+(L.w+s).toFixed(1),why:`+${String(s).replace('.',',')} kg : toutes tes séries étaient au max de la fourchette la dernière fois.`}}
  return {w:L.w,why:'Même charge que la dernière fois : bats tes répétitions.'};
}
function bestOf(id){let b=0;S.history.forEach(h=>h.ex.forEach(x=>{if(x.id===id)x.sets.forEach(s=>{if((s.w||0)>b)b=s.w||0})}));return b}

/* ---------- Nutrition (Mifflin-St Jeor) ---------- */
function nutrition(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==='F'?-161:5);
  const tdee = bmr*(1.2+0.075*p.days);
  const k = {masse:1.1,seche:.8,recompo:1}[p.goal];
  const prot = {masse:1.8,seche:2.2,recompo:2}[p.goal];
  return {kcal:Math.round(tdee*k/10)*10, tdee:Math.round(tdee/10)*10, prot:Math.round(p.weight*prot), imc:(p.weight/((p.height/100)**2)).toFixed(1)};
}

/* ---------- Audio / vibration / écran allumé ---------- */
let actx=null, beepNodes=[], wakeLock=null;
function unlockAudio(){
  try{
    if(navigator.audioSession) navigator.audioSession.type='playback'; // iOS 17+ : joue même en mode silencieux
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function beepAt(t,freq,dur,vol){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.05); beepNodes.push(o);
}
function scheduleBeeps(sec){
  cancelBeeps(); if(!S.settings.sound||!actx) return;
  try{const t0=actx.currentTime+sec;
    [3,2,1].forEach(k=>{ if(sec-k>0.2) beepAt(t0-k,660,.12,.35) });
    beepAt(t0,990,.5,.5); beepAt(t0+.55,990,.5,.5);
  }catch(e){}
}
function cancelBeeps(){beepNodes.forEach(o=>{try{o.stop()}catch(e){}});beepNodes=[]}
function vibrate(p){ if(S.settings.vibe && navigator.vibrate) try{navigator.vibrate(p)}catch(e){} }
async function keepAwake(){try{if('wakeLock' in navigator && !wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.active){keepAwake();tick()} });

/* ---------- Dessin des schémas ---------- */
function V(a,l){const r=a*Math.PI/180;return[Math.sin(r)*l,Math.cos(r)*l]}
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]];
function lerp(A,B,e){const o={};for(const k in A)o[k]=(B[k]!==undefined)?A[k]+(B[k]-A[k])*e:A[k];return o}
const ln=(a,b,c,w)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="${c}"${w?` stroke-width="${w}"`:''}/>`;
function jointsSide(P,anc){
  const sh=V(P.t,L_.T), knee=V(P.th,L_.TH), foot=add(knee,V(P.sh,L_.SH)), el=add(sh,V(P.ua,L_.UA)), hand=add(el,V(P.fa,L_.FA));
  const J={hip:[0,0],sh,head:add(sh,V(P.t,13)),knee,foot,el,hand};
  if(P.th2!==undefined){J.knee2=V(P.th2,L_.TH);J.foot2=add(J.knee2,V(P.sh2,L_.SH))}
  const ref={foot,hand,shoulder:sh}[anc]||[0,0], off=[P.ax-ref[0],P.ay-ref[1]];
  for(const k in J)J[k]=add(J[k],off);
  return J;
}
function drawPose(pk,e){
  const pat=PAT[pk]; if(!pat) return '';
  const P=lerp(pat.A,pat.B,e); let s='', front=pat.front;
  if(!pat.ng) s+=`<line x1="8" y1="151" x2="192" y2="151" class="gr"/>`;
  let J;
  if(front){
    const cx=P.ax, hy=P.ay;
    J={cx,hipR:[cx+8,hy],hipL:[cx-8,hy],neck:[cx,hy-50],head:[cx,hy-62],sR:[cx+15,hy-46],sL:[cx-15,hy-46]};
    J.kR=add(J.hipR,V(P.th,40));J.fR=add(J.kR,V(P.sh,40));J.kL=add(J.hipL,V(-P.th,40));J.fL=add(J.kL,V(-P.sh,40));
    J.eR=add(J.sR,V(P.ua,28));J.hR=add(J.eR,V(P.fa,26));J.eL=add(J.sL,V(-P.ua,28));J.hL=add(J.eL,V(-P.fa,26));
  } else J=jointsSide(P,pat.anc);
  // équipement statique en premier
  (pat.pr||[]).forEach(p=>{ if(p.l) s+=`<line x1="${p.l[0]}" y1="${p.l[1]}" x2="${p.l[2]}" y2="${p.l[3]}" class="eq" stroke-width="${p.l[4]}"/>`; if(p.c) s+=`<circle cx="${p.c[0]}" cy="${p.c[1]}" r="${p.c[2]}" class="pd"/>`; });
  // câbles
  (pat.pr||[]).forEach(p=>{ if(p.cb) s+=ln(p.cb,J.hand,'cb'); if(p.cbF){s+=ln([J.cx+p.cbF[0],p.cbF[1]],J.hR,'cb')+ln([J.cx-p.cbF[0],p.cbF[1]],J.hL,'cb')} });
  if(front){
    s+=ln(J.hipL,J.kL,'b2')+ln(J.kL,J.fL,'b2')+ln(J.sL,J.eL,'b2')+ln(J.eL,J.hL,'b2');
    s+=ln(J.hipR,J.kR,'b')+ln(J.kR,J.fR,'b')+ln(J.hipL,J.hipR,'b')+ln([J.cx,J.hipR[1]],J.neck,'b')+ln(J.sL,J.sR,'b')+ln(J.sR,J.eR,'b')+ln(J.eR,J.hR,'b');
    s+=`<circle cx="${J.head[0]}" cy="${J.head[1]}" r="9" class="hd"/>`;
  } else {
    if(J.knee2){s+=ln(J.hip,J.knee2,'b2')+ln(J.knee2,J.foot2,'b2')}
    s+=ln(J.hip,J.knee,'b')+ln(J.knee,J.foot,'b');
    if(!pat.nt) s+=ln(J.foot,[J.foot[0]+9,J.foot[1]],'b',5);
    s+=ln(J.hip,J.sh,'b')+ln(J.sh,J.el,'b')+ln(J.el,J.hand,'b');
    s+=`<circle cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="9" class="hd"/>`;
  }
  // accessoires mobiles
  (pat.pr||[]).forEach(p=>{
    const h=J.hand;
    if(p==='plate') s+=`<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="11" class="pl"/>`;
    if(p==='plateHip') s+=`<circle cx="${J.hip[0].toFixed(1)}" cy="${(J.hip[1]-9).toFixed(1)}" r="11" class="pl"/>`;
    if(p==='barSh') s+=`<circle cx="${(J.sh[0]-11).toFixed(1)}" cy="${(J.sh[1]+3).toFixed(1)}" r="11" class="pl"/>`;
    if(p==='db') s+=ln([h[0]-7,h[1]],[h[0]+7,h[1]],'pl',4)+`<rect x="${(h[0]-10).toFixed(1)}" y="${(h[1]-5).toFixed(1)}" width="5" height="10" rx="1.5" fill="var(--ac)"/><rect x="${(h[0]+5).toFixed(1)}" y="${(h[1]-5).toFixed(1)}" width="5" height="10" rx="1.5" fill="var(--ac)"/>`;
    if(p==='dbF') [J.hR,J.hL].forEach(q=>{s+=`<rect x="${(q[0]-4).toFixed(1)}" y="${(q[1]-7).toFixed(1)}" width="8" height="14" rx="2" fill="var(--ac)"/>`});
    if(p==='handF') [J.hR,J.hL].forEach(q=>{s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="5" fill="var(--ac)"/>`});
    if(p==='handle') s+=`<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="5" fill="var(--ac)"/>`;
    if(p==='barH') s+=ln([h[0]-16,h[1]],[h[0]+16,h[1]],'pl',4);
    if(p==='pad') s+=`<circle cx="${J.foot[0].toFixed(1)}" cy="${J.foot[1].toFixed(1)}" r="7" fill="var(--ac)"/>`;
    if(p==='toes') s+=ln(J.foot,[J.foot[0]+12,151],'b',5);
    if(p.fp!==undefined){const d=V(p.fp,20);s+=ln([J.foot[0]-d[0],J.foot[1]-d[1]],[J.foot[0]+d[0],J.foot[1]+d[1]],'pl',5)}
  });
  return s;
}
function figSVG(id,cls){const pk=EX[id].p, vb=PAT[pk].vb||'0 0 200 160'; return `<svg class="fig ${cls||''}" viewBox="${vb}" data-pat="${pk}">${drawPose(pk,0)}</svg>`}
let animEls=[];
function refreshAnims(){animEls=[...document.querySelectorAll('svg[data-pat]')]}
const PERIOD=2600;
function animLoop(ts){
  const e=(1-Math.cos(2*Math.PI*(ts%PERIOD)/PERIOD))/2;
  for(const el of animEls){ if(el.isConnected) el.innerHTML=drawPose(el.dataset.pat,e) }
  requestAnimationFrame(animLoop);
}

function go(v){view=v;window.scrollTo(0,0);render()}
function render(){
  const app=$('#app'); app.className='';
  const nav=$('#nav');
  if(view==='onboard'){app.innerHTML=vProfileForm(true);nav.style.display='none'}
  else if(view==='workout' && S.active){app.className='wk';app.innerHTML=vWorkout();nav.style.display='none'}
  else{
    if(view==='workout') view='home';
    app.innerHTML = view==='home'?vHome(): view==='program'?vProgram(): view==='history'?vHistory(): vProfile();
    nav.style.display='flex';
    nav.innerHTML=[['home','Accueil'],['program','Programme'],['history','Historique'],['profile','Profil']].map(([k,l])=>`<button data-a="nav" data-v="${k}" class="${view===k?'on':''}">${IC[k==='program'?'prog':k==='history'?'hist':k==='profile'?'user':'home']}<span>${l}</span></button>`).join('');
  }
  refreshAnims(); tick();
}

function mkEx(x){
  const sg=suggest(x.id), L=S.last[x.id];
  return {id:x.id,rmin:x.rmin,rmax:x.rmax,rest:x.rest,why:sg.why,
    sets:Array.from({length:x.sets},(_,i)=>({w:sg.w,r:(L&&!L.allTop&&L.reps[i])?Math.min(x.rmax,L.reps[i]+1):x.rmin,done:false}))};
}
function startDay(di){

function nextOpen(from){const A=S.active,n=A.ex.length;for(let k=1;k<=n;k++){const i=(from+k)%n;if(openIdx(A.ex[i])>=0)return i}return from}
function afterSet(e){
  const A=S.active;
  if(A.ex.every(x=>openIdx(x)<0)){A.rest=null;cancelBeeps();save();render();toast('Séance terminée ! 💪 Enregistre-la');return}
  let label;
  if(openIdx(e)<0){ A.cur=nextOpen(A.cur); const nx=A.ex[A.cur]; label=`Exercice terminé ✓<br>Suivant : <b>${esc(EX[nx.id].n)}</b>`; }
  else { const k=openIdx(e), s=e.sets[k]; label=`Prochaine : <b>série ${k+1}/${e.sets.length} · ${EX[e.id].u==='pdc'?'PDC':String(s.w).replace('.',',')+' kg'} × ${s.r}</b>`; }
  startRest(e.rest,label); save(); render(); scrollChip();
}
function startRest(sec,label){S.active.rest={end:Date.now()+sec*1000,total:sec,label,fired:false,min:false};scheduleBeeps(sec)}
function scrollChip(){const c=document.querySelector('.chip.cur');if(c)c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}

function finish(){
  const A=S.active; const doneEx=A.ex.filter(e=>e.sets.some(s=>s.done));
  cancelBeeps(); releaseWake();
  if(!doneEx.length){S.active=null;save();go('home');toast('Aucune série validée : séance non enregistrée');return}
  let vol=0,sets=0;const prs=[];
  const exs=doneEx.map(e=>{
    const ds=e.sets.filter(s=>s.done); ds.forEach(s=>{vol+=(s.w||0)*s.r;sets++});
    const maxW=Math.max(...ds.map(s=>s.w||0)), prev=bestOf(e.id);
    if(maxW>0&&prev>0&&maxW>prev) prs.push(`${EX[e.id].n} ${String(maxW).replace('.',',')} kg`);
    S.last[e.id]={w:EX[e.id].u==='pdc'?null:maxW,reps:ds.map(s=>s.r),allTop:ds.length>=e.sets.length&&ds.every(s=>s.r>=e.rmax&&(s.w||0)>=maxW),d:Date.now()};
    return {id:e.id,sets:ds.map(s=>({w:s.w,r:s.r}))};
  });
  const entry={d:Date.now(),n:A.n,dur:Date.now()-A.start,vol:Math.round(vol),sets,ex:exs,prs};
  S.history.unshift(entry); S.nextDay=(A.di+1)%S.program.days.length; S.active=null; save();
  go('home');
  openSheet(`<div style="text-align:center"><div style="font-size:54px">🏆</div><h2>Séance terminée !</h2><p class="muted">${esc(entry.n)}</p></div>
    <div class="grid3 mt2"><div class="stat"><b>${Math.round(entry.dur/60000)}′</b><span>Durée</span></div><div class="stat"><b>${entry.sets}</b><span>Séries</span></div><div class="stat"><b>${entry.vol>=1000?(entry.vol/1000).toFixed(1)+'t':entry.vol}</b><span>Volume kg</span></div></div>
    ${prs.length?`<h3>Nouveaux records</h3><div class="tags">${prs.map(p=>`<span class="tag ac">🏆 ${esc(p)}</span>`).join('')}</div>`:''}
    <p class="muted small mt">Les charges de ta prochaine séance sont ajustées automatiquement (double progression : quand toutes les séries atteignent le haut de la fourchette, la charge augmente).</p>

}

/* ---------- Timer ---------- */
let goTimer=null;
function tick(){
  const A=S.active; if(!A) return;
  const el=$('#elapsed'); if(el) el.textContent=fmtT((Date.now()-A.start)/1000);
  const R=A.rest; if(!R) return;
  const rem=(R.end-Date.now())/1000;
  const t=$('#restT'), t2=$('#restT2'), ring=$('#ringFg');
  if(rem>0){
    const txt=fmtT(Math.ceil(rem));
    if(t)t.textContent=txt; if(t2)t2.textContent=txt;
    if(ring) ring.setAttribute('stroke-dashoffset',(CIRC*(1-rem/R.total)).toFixed(1));
  } else if(!R.fired){
    R.fired=true; save();
    vibrate([300,120,300,120,300]);
    if(t)t.textContent='GO !'; if(t2)t2.textContent='GO !';
    const sub=$('#restSub'); if(sub) sub.textContent="C'EST REPARTI";
    if(ring) ring.setAttribute('stroke-dashoffset',CIRC.toFixed(1));
    const ov=$('#rest'); if(ov) ov.classList.add('go');
    const pill=$('#restPill'); if(pill) pill.classList.add('go');
    clearTimeout(goTimer);
    goTimer=setTimeout(()=>{ if(S.active&&S.active.rest&&S.active.rest.fired){S.active.rest=null;save();render()} },2600);
  } else if(R.fired && Date.now()-R.end>4000){ A.rest=null; save(); render(); }
}

/* ---------- Actions ---------- */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, A=S.active;
  switch(a){
    case 'nav': go(el.dataset.v); break;
    case 'set': { readForm(); let v=el.dataset.val; if(el.dataset.k==='days')v=+v; F[el.dataset.k]=v; render(); break; }
    case 'saveProfile': {
      readForm();
      const age=+F.age, w=+String(F.weight).replace(',','.'), h=+F.height;
      if(!(age>=14&&age<=90)) return toast('Âge invalide (14–90)');
      if(!(w>=35&&w<=250)) return toast('Poids invalide');
      if(!(h>=130&&h<=230)) return toast('Taille invalide (en cm)');
      const first=!S.profile;
      S.profile={sex:F.sex,age,weight:w,height:h,level:F.level,goal:F.goal,days:+F.days};
      S.program=generate(S.profile); S.nextDay=0; F=null; save();
      toast(first?'Programme généré ✓':'Programme mis à jour ✓'); go(first?'home':'program'); break;
    }
    case 'start': unlockAudio(); startDay(+el.dataset.d); break;
    case 'exinfo': exInfo(el.dataset.id, el.dataset.d!=null?+el.dataset.d:null); break;
    case 'closeSheet': closeSheet(); break;
    case 'validate': { unlockAudio(); const e=A.ex[A.cur], i=openIdx(e); if(i<0)return; e.sets[i].done=true; afterSet(e); break; }
    case 'toggle': { unlockAudio(); const e=A.ex[A.cur], s=e.sets[+el.dataset.i]; if(s.done){s.done=false;save();render()} else {s.done=true;afterSet(e)} break; }
    case 'adj': {
      const e=A.ex[A.cur], i=+el.dataset.i, s=e.sets[i], d=+el.dataset.d;
      if(el.dataset.f==='r'){ s.r=Math.max(0,s.r+d) }
      else { const st=stepOf(e.id,s.w); s.w=Math.max(0,+(s.w+d*st).toFixed(1));
        // propage aux séries suivantes non validées
        if(!s.done) e.sets.forEach((x,j)=>{ if(j>i&&!x.done) x.w=s.w }); }
      save(); render(); break;
    }
    case 'goEx': A.cur=+el.dataset.i; save(); render(); scrollChip(); break;
    case 'nextEx': A.cur=nextOpen(A.cur); save(); render(); scrollChip(); break;
    case 'finish': finish(); break;
    case 'quit': openSheet(`<h2>Quitter la séance ?</h2><p class="muted small mt">Tu peux enregistrer les séries déjà validées ou abandonner.</p>
      <button class="btn mt2" data-a="finishNow">Enregistrer & terminer</button>
      <button class="btn red mt" data-a="abandon">Abandonner sans enregistrer</button>
      <button class="btn ghost mt" data-a="closeSheet">Continuer la séance</button>`); break;
    case 'finishNow': closeSheet(); finish(); break;
    case 'abandon': cancelBeeps(); releaseWake(); S.active=null; save(); closeSheet(); go('home'); break;
    case 'swap': swapSheet(); break;
    case 'doSwap': { const e=A.ex[A.cur], nid=el.dataset.id, sg=suggest(nid); e.id=nid; e.why=sg.why; e.sets.forEach(s=>{if(!s.done)s.w=sg.w}); save(); closeSheet(); render(); toast('Exercice remplacé'); break; }
    case 'restAdd': { const R=A.rest; if(!R)break; const d=+el.dataset.s; R.end+=d*1000; R.total=Math.max(5,R.total+d); R.fired=false;
      const rem=(R.end-Date.now())/1000; if(rem<=0){R.end=Date.now()+100} else scheduleBeeps(rem); $('#rest')&&$('#rest').classList.remove('go'); save(); tick(); break; }
    case 'restSkip': cancelBeeps(); A.rest=null; save(); render(); break;
    case 'restMin': A.rest.min=true; save(); render(); break;
    case 'restExpand': if(A.rest){A.rest.min=false; save(); render()} break;
    case 'toggleSet': S.settings[el.dataset.k]=!S.settings[el.dataset.k]; save(); render(); break;
    case 'testSound': unlockAudio(); if(actx){const t=actx.currentTime+.1;beepAt(t,660,.12,.35);beepAt(t+.4,990,.5,.5)} vibrate(200); break;
    case 'delHist': if(confirm('Supprimer cette séance de l’historique ?')){S.history.splice(+el.dataset.i,1);save();render()} break;
    case 'export': {
      const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
      const u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='coach-muscu-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),3000); break;
    }
    case 'import': $('#importFile').click(); break;
    case 'reset': if(confirm('Effacer TOUTES les données (profil, programme, historique) ?')){localStorage.removeItem(KEY);S=defState();F=null;go('onboard')} break;
  }
});

/* ---------- Icône & manifeste générés (PWA mono-fichier) ---------- */
function makeIcon(size){
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'), s=size/180;
  x.fillStyle='#0a0a0c'; x.fillRect(0,0,size,size);
  x.fillStyle='#d4ff3a';
  const rr=(X,Y,W,H,R)=>{x.beginPath();x.moveTo(X+R,Y);x.arcTo(X+W,Y,X+W,Y+H,R);x.arcTo(X+W,Y+H,X,Y+H,R);x.arcTo(X,Y+H,X,Y,R);x.arcTo(X,Y,X+W,Y,R);x.fill()};
  rr(40*s,60*s,18*s,60*s,5*s); rr(122*s,60*s,18*s,60*s,5*s); rr(24*s,72*s,14*s,36*s,4*s); rr(142*s,72*s,14*s,36*s,4*s); rr(56*s,84*s,68*s,12*s,3*s);
  return c.toDataURL('image/png');
}
function setupPWA(){
  try{
    const i180=makeIcon(180), i512=makeIcon(512);
    const l=document.createElement('link'); l.rel='apple-touch-icon'; l.href=i180; document.head.appendChild(l);
    const start=location.href.split('#')[0].split('?')[0];
    const man={name:'Coach Muscu',short_name:'Coach Muscu',start_url:start,scope:start.replace(/[^/]*$/,''),display:'standalone',background_color:'#0a0a0c',theme_color:'#0a0a0c',orientation:'portrait',icons:[{src:i512,sizes:'512x512',type:'image/png'},{src:i180,sizes:'180x180',type:'image/png'}]};
    const m=document.createElement('link'); m.rel='manifest'; m.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'})); document.head.appendChild(m);
  }catch(e){}
}
