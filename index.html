<style>
/* =========================================================
   Design inspiré des Human Interface Guidelines d'Apple
   (couleurs système iOS en mode sombre, typographie SF,
   listes groupées, barres translucides, feuilles modales)
   ========================================================= */
:root{color-scheme:dark;
 --bg:#000;--bg2:#1c1c1e;--bg3:#2c2c2e;--bg4:#3a3a3c;
 --fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.32);--fill3:rgba(118,118,128,.24);--fill4:rgba(118,118,128,.18);
 --sep:rgba(84,84,88,.65);--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);
 --tint:#c8ff2e;--tint-d:rgba(200,255,46,.16);
 --green:#30d158;--red:#ff453a;--orange:#ff9f0a;--blue:#0a84ff;--purple:#bf5af2;--teal:#40c8e0;--pink:#ff375f;--indigo:#5e5ce6;--gray:#8e8e93;
 --fg:#fff;--ac:var(--tint);
 --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
 --ease:cubic-bezier(.32,.72,0,1);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
 --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--label);font:17px/1.29 var(--font);letter-spacing:-.024em;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;min-height:100dvh;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;letter-spacing:inherit;text-align:inherit}
input{font:inherit;color:inherit;-webkit-user-select:text;user-select:text;letter-spacing:inherit}
a{color:var(--tint);text-decoration:none}
svg.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex:none;overflow:visible}
.tint{color:var(--tint)}.center{text-align:center}.mt{margin-top:10px}
.pad{padding:0 16px 20px}
.istep{width:28px;height:28px;border-radius:50%;background:var(--tint);color:#000;font-weight:700;font-size:15px;display:grid;place-items:center;flex:none}.istep+.cbody svg{width:18px;height:18px;vertical-align:-3px;color:var(--blue)}

/* ---- Barre de navigation (large title qui se replie) ---- */
.nav{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--st);border-bottom:.5px solid transparent;transition:background-color .25s,border-color .25s}
.nav.scrolled{background:rgba(22,22,24,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.nav-in{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px 0 16px;max-width:680px;margin:0 auto}
.nav-t{font-size:17px;font-weight:600;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s var(--ease);white-space:nowrap}
.nav.scrolled .nav-t{opacity:1;transform:none}
.nav-l{justify-self:start}.nav-r{justify-self:end}
.tbtn{color:var(--tint);font-size:17px;min-height:44px;display:inline-flex;align-items:center;gap:3px;padding:0 4px;transition:opacity .15s}
.tbtn:active{opacity:.35}
.tbtn.b{font-weight:600}
.navic{font-size:30px;color:var(--tint);width:44px;height:44px;display:grid;place-items:center}
.navic:active{opacity:.35}
.pg{max-width:680px;margin:0 auto;padding:calc(var(--st) + 44px) 0 calc(var(--sb) + 110px)}
body.has-mini .pg{padding-bottom:calc(var(--sb) + 180px)}
.lt-wrap{padding:0 16px 14px}
.kicker{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:-.003em;margin-bottom:1px}
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.011em}
.lt-sub{font-size:15px;color:var(--label2);margin-top:1px;line-height:1.35}

/* ---- Listes groupées en encart (inset grouped) ---- */
.sec{margin:0 16px 32px}
.sec-h{font-size:13px;line-height:18px;color:var(--label2);text-transform:uppercase;padding:0 16px 7px;letter-spacing:-.006em}
.sec-h.big{font-size:22px;line-height:28px;font-weight:700;text-transform:none;color:var(--label);padding:0 0 10px 4px;letter-spacing:.017em}
.sec-f{font-size:13px;line-height:18px;color:var(--label2);padding:7px 16px 0;letter-spacing:-.006em}
.grp{background:var(--bg2);border-radius:12px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:44px;padding:11px 16px;text-align:left;transition:background-color .2s}
.cell::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);height:.5px;background:var(--sep)}
.grp>.cell:first-child::before{display:none}
.hasico{--inset:60px}.cell.ex{--inset:86px}.cell.top{align-items:flex-start}
button.cell:active,label.cell:active{background:var(--bg4);transition:none}
.cico{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:18px;flex:none}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ct{font-size:17px;line-height:22px}
.ct.sm{font-size:15px;line-height:20px}
.cs{font-size:13px;line-height:17px;color:var(--label2);letter-spacing:-.006em}
.cv{color:var(--label2);font-size:17px;white-space:nowrap}
.cv.t{color:var(--tint);font-weight:600}
.chev{color:var(--label3);font-size:13px;display:flex}
.ck{color:var(--tint);font-size:18px;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s var(--ease)}
.sel .ck{opacity:1;transform:none}
.mk{font-size:22px;flex:none;margin-top:-1px}.mk.g{color:var(--green)}.mk.r{color:var(--red)}
.cell.stack{flex-direction:column;align-items:stretch;gap:10px;padding-top:12px;padding-bottom:12px}
.cin{background:transparent;border:0;outline:0;text-align:right;width:80px;font-size:17px;color:var(--label);padding:0}
.cin::placeholder{color:var(--label3)}
.unit{color:var(--label2);font-size:17px;margin-left:-8px}

/* ---- Cartes (style Forme / Fitness) ---- */
.card{margin:0 16px 20px;background:var(--bg2);border-radius:16px;padding:16px;display:block;width:calc(100% - 32px);text-align:left}
button.card{transition:transform .2s var(--ease)}
button.card:active{transform:scale(.98)}
.t2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.017em}
.sub{font-size:15px;color:var(--label2);line-height:20px}
.cap{font-size:13px;font-weight:600;color:var(--tint);text-transform:uppercase;letter-spacing:-.003em}
.sum{display:flex;align-items:center;gap:20px}
.ringsvg{width:104px;height:104px;flex:none}
.sumstats{flex:1;display:grid;gap:12px}
.sumstats span{font-size:13px;color:var(--label2);display:block}
.sumstats b{font:600 22px/1.15 var(--round);letter-spacing:0}
.tmbs{display:flex;gap:8px;overflow-x:auto;margin:14px -16px;padding:0 16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.tmbs::-webkit-scrollbar{display:none}
.tmb{flex:none;width:84px;height:66px;border-radius:12px;background:var(--bg3);padding:4px;scroll-snap-align:start}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.pill{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:var(--fill4);color:var(--label2);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.pill.t{background:var(--tint-d);color:var(--tint)}
.resume{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#2a3510,#1c1c1e 70%);border:.5px solid rgba(200,255,46,.35)}
.resume .cico{background:var(--tint);color:#000;width:44px;height:44px;border-radius:12px;font-size:24px}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:18px 20px 10px}
.exth{width:56px;height:44px;border-radius:9px;background:var(--bg3);flex:none;padding:2px}
.vbar{flex:1;height:6px;border-radius:3px;background:var(--fill4);overflow:hidden}
.vbar i{display:block;height:100%;border-radius:3px;background:var(--tint)}
.vbar i.low{background:var(--orange)}
.profhead{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(180deg,#636366,#48484a);display:grid;place-items:center;font-size:40px;color:#d1d1d6;flex:none;overflow:hidden}
.empty{text-align:center;padding:70px 40px;color:var(--label2)}
.empty>.ic{font-size:64px;color:var(--label3);margin-bottom:16px}
.empty .t2{color:var(--label);margin-bottom:6px}

/* ---- Boutons ---- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:14px 20px;border-radius:14px;background:var(--tint);color:#000;font-size:17px;font-weight:600;transition:transform .2s var(--ease),opacity .2s;text-align:center}
.btn:active{transform:scale(.97);opacity:.8}
.btn.gray{background:var(--fill3);color:var(--tint)}
.btn.red{background:rgba(255,69,58,.15);color:var(--red)}
.btn.sm2{min-height:44px;padding:10px 12px;font-size:15px;border-radius:12px}
.btnwrap{margin:0 16px 32px;display:grid;gap:10px}

/* ---- Contrôle segmenté ---- */
.segc{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);background:var(--fill3);border-radius:9px;padding:2px;min-height:32px;isolation:isolate}
.segc .thumb{position:absolute;z-index:-1;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));background:#636366;border-radius:7px;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transform:translateX(calc(var(--i)*100%));transition:transform .35s var(--ease)}
.segc button{font-size:13px;font-weight:500;text-align:center;padding:6px 2px;transition:opacity .2s}
.segc button.on{font-weight:600}
.segc button:not(.on):active{opacity:.45}
.segwrap{padding:0 16px 4px}

/* ---- Interrupteur ---- */
.sw{width:51px;height:31px;border-radius:99px;background:var(--fill);position:relative;flex:none;transition:background-color .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .35s var(--ease)}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}

/* ---- Barre d'onglets + mini-lecteur de séance ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(22,22,24,.8);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding-bottom:var(--sb)}
.tabbar-in{display:flex;max-width:680px;margin:0 auto;height:50px}
.tabbar-in button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--gray);font-size:10px;font-weight:500;letter-spacing:.01em;padding-top:2px}
.tabbar-in button .ic{font-size:26px}
.tabbar-in button.on{color:var(--tint)}
.mini{display:flex;align-items:center;gap:12px;width:calc(100% - 16px);max-width:664px;margin:8px auto 0;padding:8px 14px 8px 8px;border-radius:14px;background:var(--bg3);text-align:left;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.mini:active{background:var(--bg4)}
.mini-ic{width:40px;height:40px;border-radius:10px;background:var(--tint);color:#000;display:grid;place-items:center;font-size:22px;flex:none}
.mini .ct{font-size:15px;font-weight:600;line-height:19px}
.mini .cs{font-variant-numeric:tabular-nums}
.mini .cs b{color:var(--tint);font-weight:600}

/* ---- Feuille modale ---- */
.sheet{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s .5s}
.sheet.open{visibility:visible;transition:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .4s}
.sheet.open .sheet-bg{opacity:1}
.sheet-body{position:absolute;left:0;right:0;bottom:0;top:calc(var(--st) + 12px);max-width:680px;margin:0 auto;background:var(--bg2);border-radius:12px 12px 0 0;transform:translateY(100%);transition:transform .5s var(--ease);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
.sheet.open .sheet-body{transform:none}
.sh-head{flex:none;padding:5px 8px 0 16px;touch-action:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 2px}
.sh-bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:44px}
.sh-bar .t{font-weight:600;font-size:17px}
.sh-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 0 calc(var(--sb) + 28px);overscroll-behavior:contain}
.sheet .grp,.sheet .card{background:var(--bg3)}
.sheet .exth,.sheet .tmb{background:var(--bg4)}
.sheet button.cell:active{background:#48484a}
.sheet .cell::before{background:rgba(84,84,88,.65)}
.hero-ic{font-size:64px;color:var(--tint);text-align:center;margin:8px 0 6px}

/* ---- Feuille d'actions ---- */
.as{position:fixed;inset:0;z-index:70}
.as-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.as.show .as-bg{opacity:1}
.as-in{position:absolute;left:8px;right:8px;bottom:calc(var(--sb) + 8px);max-width:520px;margin:0 auto;transform:translateY(120%);transition:transform .45s var(--ease)}
.as.show .as-in{transform:none}
.as-grp{background:rgba(44,44,46,.86);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:14px;overflow:hidden;margin-bottom:8px}
.as-h{padding:15px 16px 14px;text-align:center;font-size:13px;line-height:18px;color:var(--label2);display:flex;flex-direction:column;gap:2px}
.as-h b{font-weight:600}
.as-b{display:block;width:100%;min-height:57px;font-size:20px;color:var(--tint);text-align:center;border-top:.5px solid var(--sep);letter-spacing:.02em}
.as-grp>.as-b:first-child{border-top:0}
.as-b.destructive{color:var(--red)}.as-b.bold{font-weight:600}
.as-b:active{background:rgba(255,255,255,.1)}
.as-cancel{background:var(--bg3);border-radius:14px;font-weight:600;border:0}

/* ---- Bannière (toast) ---- */
.toast{position:fixed;left:50%;top:calc(var(--st) + 8px);z-index:80;transform:translate(-50%,-160%);background:rgba(44,44,46,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:var(--label);font-size:15px;font-weight:600;padding:12px 18px 12px 14px;border-radius:999px;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .5s var(--ease);white-space:nowrap;max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}
.toast .ic{font-size:20px;color:var(--green)}
.toast.err .ic{color:var(--red)}

/* ---- Écran de bienvenue ---- */
.welcome{min-height:100dvh;display:flex;flex-direction:column;padding:calc(var(--st) + 56px) 36px calc(var(--sb) + 20px);max-width:520px;margin:0 auto}
.appicon{width:96px;height:96px;border-radius:22px;background:linear-gradient(160deg,#26261f,#0b0b0c);border:.5px solid rgba(255,255,255,.12);display:grid;place-items:center;margin:0 auto 26px;color:var(--tint);font-size:58px;box-shadow:0 14px 44px rgba(200,255,46,.18)}
.welcome .lt{text-align:center}
.feats{margin:44px 0 24px;display:grid;gap:28px;flex:1;align-content:start}
.feat{display:flex;gap:16px;align-items:flex-start}
.feat .ic{font-size:32px;color:var(--tint);margin-top:2px}
.feat b{display:block;font-size:15px;font-weight:600;line-height:20px}
.feat span{font-size:15px;color:var(--label2);line-height:20px}

/* ---- Schémas d'exercices ---- */
svg.fig{display:block;width:100%;height:100%}
svg.fig .b{stroke:var(--fg);stroke-width:7;stroke-linecap:round;fill:none}
svg.fig .b2{stroke:#6d6d72;stroke-width:6;stroke-linecap:round;fill:none}
svg.fig .hd{fill:var(--fg)}
svg.fig .eq{stroke:#48484a;stroke-linecap:round;fill:none}
svg.fig .gr{stroke:#2c2c2e;stroke-width:2}
svg.fig .cb{stroke:var(--tint);stroke-width:1.6;stroke-dasharray:4 3;opacity:.75}
svg.fig .pl{fill:#000;stroke:var(--tint);stroke-width:3}
svg.fig .pd{fill:#48484a}
.figbox{margin-top:14px;border-radius:16px;background:radial-gradient(circle at 50% 45%,#1e2410 0%,#121214 72%);padding:6px;aspect-ratio:200/150}
.figbox svg.fig{height:100%}

/* ---- Mode séance ---- */
.wkbar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--st);background:rgba(0,0,0,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.wkbar-in{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 12px;max-width:680px;margin:0 auto}
.wkt{text-align:center;line-height:1.15;white-space:nowrap}
.wkt b{font-size:15px;font-weight:600;display:block}
.wkt span{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums}
.storybar{display:flex;gap:3px;padding:0 14px;max-width:680px;margin:0 auto}
.storybar button{flex:1;padding:6px 0 9px}
.storybar i{display:block;height:3px;border-radius:2px;background:var(--fill);overflow:hidden;position:relative}
.storybar i b{position:absolute;inset:0;background:var(--tint);transform-origin:left;transform:scaleX(var(--p));transition:transform .5s var(--ease)}
.storybar .cur i{background:rgba(200,255,46,.3);box-shadow:0 0 0 1px rgba(200,255,46,.4)}
.wkmain{max-width:680px;margin:0 auto;padding:calc(var(--st) + 44px + 26px) 0 calc(var(--sb) + 130px)}
.excard{margin:0 16px 20px;padding-top:14px}
.exk{font-size:13px;font-weight:600;color:var(--tint);text-transform:uppercase;letter-spacing:-.003em}
.exn{font-size:28px;line-height:34px;font-weight:700;letter-spacing:.013em;margin-top:2px}
.exm{font-size:15px;color:var(--label2);margin-top:2px;line-height:20px}
.exbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr)}
.stats4.c3{grid-template-columns:repeat(3,1fr)}
.stats4>div{padding:12px 4px 11px;text-align:center;position:relative}
.stats4>div+div::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
.stats4 b{display:block;font:600 20px/1.25 var(--round);letter-spacing:0;white-space:nowrap}
.stats4 span{font-size:11px;color:var(--label2);text-transform:uppercase;letter-spacing:.02em;font-weight:500}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:10px;align-items:center;padding:10px 12px 10px 14px;position:relative;transition:background-color .25s}
.setrow+.setrow::before{content:"";position:absolute;top:0;right:0;left:52px;height:.5px;background:var(--sep)}
.setrow.cur{background:rgba(200,255,46,.07)}
.sn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 15px var(--round);color:var(--label2);background:var(--fill4)}
.setrow.cur .sn{background:var(--tint);color:#000}
.setrow.done .sn{background:transparent;color:var(--green);font-size:18px}

function fits(id,p){return p&&p.place==='home'?hasEq(id,p):!(EX[id].homeOnly&&!EX[id].any)&&!((p&&p.noMach)||[]).includes(MACH_OF[id])}
function resolveEx(id,p,used){
  if(!p||p.place!=='home') return gymResolve(id,p||{},used);
  for(const c of [...(HOME_ALT[id]||[]),id]) if(EX[c]&&hasEq(c,p)&&!used.has(c)) return c;
  const m=EX[id].m, rk={H:0,C:1,I:2,A:3}, t=rk[EX[id].t], ld=x=>noLoad(x)?1:0;
  const c=Object.keys(EX).filter(x=>EX[x].m===m&&hasEq(x,p)&&!used.has(x)).sort((a,b)=>Math.abs(rk[EX[a].t]-t)-Math.abs(rk[EX[b].t]-t)||ld(a)-ld(b));
  return c[0]||null;
}

function buildDay(k,p){
  const cap=({deb:6,int:7,adv:8})[p.level]-(p.goal==='seche'?1:0), t=TPL[k], ids=[], used=new Set();
  t.x.forEach(id=>{ if(p.level==='deb'&&BEG_SUB[id]) id=BEG_SUB[id]; const r=resolveEx(id,p,used); if(r&&!used.has(r)){used.add(r);ids.push(r)} });
  const sel=ids.slice(0,cap), home=p.place==='home';
  const f=home?'À la maison · '+[...new Set(sel.map(id=>MUS[EX[id].m]))].slice(0,3).join(', '):t.f;
  const prev=_placeCtx; _placeCtx=p.place||'gym';
  const ex=sel.map((id,i)=>prescribe(id,i,p));
  if(home||(p.noMach||[]).length){
    /* Compensation du volume : chaque muscle garde au moins autant de séries que la version salle
       (les exercices manquants faute de matériel sont rattrapés par des séries en plus, 5 max par exercice). */
    const gp={...p,place:'gym'}, gids=[], gu=new Set();
    t.x.forEach(id=>{ if(p.level==='deb'&&BEG_SUB[id]) id=BEG_SUB[id]; if(!gu.has(id)){gu.add(id);gids.push(id)} });
    const tgt={}, cur={};
    gids.slice(0,cap).forEach((id,i)=>{const m=EX[id].m; tgt[m]=(tgt[m]||0)+prescribe(id,i,gp).sets});
    ex.forEach(x=>{const m=EX[x.id].m; cur[m]=(cur[m]||0)+x.sets});
    for(const m in tgt){ let d=tgt[m]-(cur[m]||0), g=30;
      while(d>0&&g--){ const c=ex.filter(x=>EX[x.id].m===m&&x.sets<5).sort((a,b)=>a.sets-b.sets)[0]; if(!c) break; c.sets++; d--; } }
  }
  _placeCtx=prev;
  return {k,n:t.n,f,place:p.place||'gym',ex};
}

let GF=null, figMode='move', _exCtx=null;
const PH_KEY=KEY+'_photos'; let _ph=null;
function phAll(){if(_ph) return _ph; try{_ph=JSON.parse(localStorage.getItem(PH_KEY))||{}}catch(e){_ph={}} return _ph}
function phSave(){try{localStorage.setItem(PH_KEY,JSON.stringify(_ph||{}));return true}catch(e){toastErr('Mémoire du téléphone pleine pour les photos');return false}}
function compressImg(file,max=720,q=.72){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
function machSVG(id,num=true){
  const k=MACH_OF[id], M=MACH[k]; if(!M) return '';
  const pts=M.pts.map(([x,y],i)=>{ if(k==='crossover'){const h=(MACH_SET[id]&&MACH_SET[id].h!=null)?MACH_SET[id].h:60; if(i===0){x=210;y=h} if(i===1){x=170;y=h>100?h-48:h+40}} return num?`<g class="mco"><circle cx="${x}" cy="${y}" r="9"/><text x="${x}" y="${y+4}" text-anchor="middle">${i+1}</text></g>`:''}).join('');
  const bg=MDR?`<defs><linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f4f6"/><stop offset="1" stop-color="#cdcdd2"/></linearGradient></defs><rect width="240" height="180" fill="url(#mbg)"/>`:'';
  return `<svg class="machsvg${MDR?' rnd':''}" viewBox="0 0 240 180" aria-label="${esc(M.n)}">${bg}${M.draw(id)}${pts}</svg>`;
}
function machVisual(id){const k=MACH_OF[id], ph=phAll()[k]; return ph?`<img class="mphoto" src="${ph}" alt="Ma photo : ${esc(MACH[k].n)}">`:machSVG(id)}
function machSection(id){
  const k=MACH_OF[id], M=MACH[k]; if(!M) return '';
  const g=gymOf(), C=CHAINS[g.chain]||CHAINS.autre, ph=phAll()[k], st=MACH_SET[id];

function gymSheet(){
  const g=gymOf(), used=new Set(Object.values(MACH_OF)), keys=Object.keys(MACH).filter(k=>used.has(k)), ph=phAll();
  const src=(F&&!F._sheet)?F:(S.profile||{});
  GF={chain:src.chain||g.chain||'onair',noMach:[...(src.noMach||g.noMach||[])]};

function prescribe(id,i,p){
  const e=EX[id]; let sets,rmin,rmax;
  if(e.t==='H'){

    if(p.level==='deb'){rmin=8;rmax=10;sets=3}
    else sets = (p.level==='adv' || (p.goal==='masse' && i<2)) ? 4 : 3;
  } else if(e.t==='C'){rmin=8;rmax=12;sets=3+((p.level==='adv'&&p.goal!=='seche'&&i<3)?1:0)}
  else if(e.t==='I'){rmin=10;rmax=15;sets=p.level==='deb'?2:3}
  else {rmin=12;rmax=20;sets=p.level==='deb'?2:3}
  const x={id,sets,rmin,rmax,rest:REST[e.t]};
  if(noLoad(id)&&(p.place==='home'||e.homeOnly)&&e.t!=='A'){
    if(e.hard){x.rmin=p.level==='deb'?3:5;x.rmax=p.level==='deb'?8:12}
    else if(e.t==='C'){x.rmin=p.level==='deb'?8:10;x.rmax=p.level==='deb'?15:20}
    else {x.rmin=12;x.rmax=20}
  }
  if(p.place==='home'&&(e.u==='halt'||e.u==='kb')){const pv=_placeCtx;_placeCtx='home';const c=capOf(id),b=baseLoad(id);_placeCtx=pv;
    if(c&&b&&b>c*1.15){x.rmin=Math.min(x.rmin+4,20);x.rmax=Math.min(x.rmax+6,25);x.capped=true}}
  return x;
}

  const cap=({deb:6,int:7,adv:8})[p.level]-(p.goal==='seche'?1:0)+(ms.length<=3?1:0);

/* ---------- Charges conseillées & progression ---------- */
function stepOf(id,w){const u=EX[id].u; if(u==='kb')return 4; if(u==='halt')return (w||0)>=20?2:1; if(id==='presse_cuisses'||id==='hack_squat')return 5; return 2.5}
function roundLoad(id,w){const u=EX[id].u; if(u==='kb') return Math.max(8,Math.round(w/4)*4); const st=u==='halt'?(w>=20?2:1):2.5; const r=Math.round(w/st)*st; const min={barre:20,halt:2,mach:5,poulie:2.5}[u]||2.5; return Math.max(min,+r.toFixed(1))}
function baseLoad(id){
  const e=EX[id],p=S.profile; if(noLoad(id))return null;
  const lv={deb:.5,int:.8,adv:1.05}[p.level], sx=p.sex==='F'?.62:1, ag=p.age>=55?.82:p.age>=45?.9:p.age<18?.8:1;
  return roundLoad(id,p.weight*e.r*lv*sx*ag);
}
function suggest(id){
  const L=S.last[id], X=EX[id], home=curPlace()==='home';
  if(noLoad(id)){
    if(X.u==='elast') return {w:null,why:'Élastique : choisis la résistance qui t’amène à 1–2 reps de l’échec dans la fourchette ; passe à l’élastique supérieur quand tu dépasses le haut.'};
    if(!home&&!X.homeOnly) return {w:null,why:'Poids du corps — utilise l’assistance de la machine si tu n’atteins pas la fourchette.'};
    if(L&&L.allTop) return {w:null,why:'Haut de fourchette atteint la dernière fois : descente en 3 s, pause en bas, ou variante plus difficile.'};
    return {w:null,why:'Poids du corps : descente contrôlée en 2–3 s, série menée jusqu’à 1–2 reps de l’échec.'};
  }
  let r;
  if(!L||L.w==null) r={w:baseLoad(id),why:'Charge estimée d’après ton profil : ajuste-la dès la 1re série.'};
  else if(L.allTop){const st=stepOf(id,L.w);r={w:+(L.w+st).toFixed(1),why:`+${String(st).replace('.',',')} kg : toutes tes séries étaient au max de la fourchette la dernière fois.`}}
  else r={w:L.w,why:'Même charge que la dernière fois : bats tes répétitions.'};
  const c=capOf(id);
  if(c!=null&&r.w>c) r={w:c,why:`Charge plafonnée à ton matériel (${String(c).replace('.',',')} kg) : descente en 3 s et série menée jusqu’à 1 rep de l’échec pour garder l’intensité.`};
  return r;
}
function bestOf(id){let b=0;S.history.forEach(h=>h.ex.forEach(x=>{if(x.id===id)x.sets.forEach(s=>{if((s.w||0)>b)b=s.w||0})}));return b}

/* ---------- Nutrition (Mifflin-St Jeor) ---------- */
function nutrition(p){
  const bmr = 10*p.weight + 6.25*p.height - 5*p.age + (p.sex==='F'?-161:5);
  const tdee = bmr*(1.2+0.075*p.days);
  const k = {masse:1.1,seche:.8,recompo:1}[p.goal];
  const prot = {masse:1.8,seche:2.2,recompo:2}[p.goal];
  /* Plancher de sécurité : pas en dessous de 1 200 kcal (F) / 1 500 kcal (H) sans suivi médical,
     sans jamais dépasser la maintenance en sèche. */
  const raw = tdee*k, minK = p.sex==='F'?1200:1500, floorK = Math.min(minK, tdee);
  const kc = Math.max(raw, floorK), floored = kc > raw + 1;
  const kcal = Math.round(kc/10)*10;
  /* IMC > 30 : protéines calculées sur un poids ajusté (poids à IMC 25 + 40 % de l'excédent),
     plafonnées à 40 % des calories. */
  const h2 = (p.height/100)**2, imc = p.weight/h2, w25 = 25*h2;
  const refW = imc > 30 ? w25 + .4*(p.weight - w25) : p.weight;
  const protG = Math.round(Math.min(refW*prot, kcal*.4/4));
  return {kcal, tdee:Math.round(tdee/10)*10, prot:protG, refW:Math.round(refW), adjW:imc>30, floored, imc:imc.toFixed(1)};
}

/* ---------- Audio / vibration / écran allumé ---------- */
let actx=null, beepNodes=[], wakeLock=null;
function unlockAudio(){
  try{
    if(navigator.audioSession) navigator.audioSession.type='playback'; // iOS 17+ : joue même en mode silencieux
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
}
function beepAt(t,freq,dur,vol){
  const o=actx.createOscillator(), g=actx.createGain();
  o.type='sine'; o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.05); beepNodes.push(o);
}
function scheduleBeeps(sec){
  cancelBeeps(); if(!S.settings.sound||!actx) return;
  try{const t0=actx.currentTime+sec;
    [3,2,1].forEach(k=>{ if(sec-k>0.2) beepAt(t0-k,660,.12,.35) });
    beepAt(t0,990,.5,.5); beepAt(t0+.55,990,.5,.5);
  }catch(e){}
}
function cancelBeeps(){beepNodes.forEach(o=>{try{o.stop()}catch(e){}});beepNodes=[]}
function vibrate(p){ if(S.settings.vibe && navigator.vibrate) try{navigator.vibrate(p)}catch(e){} }
async function keepAwake(){try{if('wakeLock' in navigator && !wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>wakeLock=null)}}catch(e){}}
function releaseWake(){try{wakeLock&&wakeLock.release()}catch(e){}wakeLock=null}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && S.active){keepAwake();tick()} });

/* ---------- Dessin des schémas ---------- */
function V(a,l){const r=a*Math.PI/180;return[Math.sin(r)*l,Math.cos(r)*l]}
const add=(p,q)=>[p[0]+q[0],p[1]+q[1]];
function lerp(A,B,e){const o={};for(const k in A)o[k]=(B[k]!==undefined)?A[k]+(B[k]-A[k])*e:A[k];return o}
const ln=(a,b,c,w)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" class="${c}"${w?` stroke-width="${w}"`:''}/>`;
function jointsSide(P,anc){
  const sh=V(P.t,L_.T), knee=V(P.th,L_.TH), foot=add(knee,V(P.sh,L_.SH)), el=add(sh,V(P.ua,L_.UA)), hand=add(el,V(P.fa,L_.FA));
  const J={hip:[0,0],sh,head:add(sh,V(P.t,13)),knee,foot,el,hand};
  if(P.th2!==undefined){J.knee2=V(P.th2,L_.TH);J.foot2=add(J.knee2,V(P.sh2,L_.SH))}
  const ref={foot,hand,shoulder:sh}[anc]||[0,0], off=[P.ax-ref[0],P.ay-ref[1]];
  for(const k in J)J[k]=add(J[k],off);
  return J;
}
function drawPose(pk,e){
  const pat=PAT[pk]; if(!pat) return '';
  const P=lerp(pat.A,pat.B,e); let s='', front=pat.front;
  if(!pat.ng) s+=`<line x1="8" y1="151" x2="192" y2="151" class="gr"/>`;
  let J;
  if(front){
    const cx=P.ax, hy=P.ay;
    J={cx,hipR:[cx+8,hy],hipL:[cx-8,hy],neck:[cx,hy-50],head:[cx,hy-62],sR:[cx+15,hy-46],sL:[cx-15,hy-46]};
    J.kR=add(J.hipR,V(P.th,40));J.fR=add(J.kR,V(P.sh,40));J.kL=add(J.hipL,V(-P.th,40));J.fL=add(J.kL,V(-P.sh,40));
    J.eR=add(J.sR,V(P.ua,28));J.hR=add(J.eR,V(P.fa,26));J.eL=add(J.sL,V(-P.ua,28));J.hL=add(J.eL,V(-P.fa,26));
  } else J=jointsSide(P,pat.anc);
  // équipement statique en premier
  (pat.pr||[]).forEach(p=>{ if(p.l) s+=`<line x1="${p.l[0]}" y1="${p.l[1]}" x2="${p.l[2]}" y2="${p.l[3]}" class="eq" stroke-width="${p.l[4]}"/>`; if(p.c) s+=`<circle cx="${p.c[0]}" cy="${p.c[1]}" r="${p.c[2]}" class="pd"/>`; });
  // câbles
  (pat.pr||[]).forEach(p=>{ if(p.cb) s+=ln(p.cb,J.hand,'cb'); if(p.cbF){s+=ln([J.cx+p.cbF[0],p.cbF[1]],J.hR,'cb')+ln([J.cx-p.cbF[0],p.cbF[1]],J.hL,'cb')} });
  if(front){
    s+=ln(J.hipL,J.kL,'b2')+ln(J.kL,J.fL,'b2')+ln(J.sL,J.eL,'b2')+ln(J.eL,J.hL,'b2');
    s+=ln(J.hipR,J.kR,'b')+ln(J.kR,J.fR,'b')+ln(J.hipL,J.hipR,'b')+ln([J.cx,J.hipR[1]],J.neck,'b')+ln(J.sL,J.sR,'b')+ln(J.sR,J.eR,'b')+ln(J.eR,J.hR,'b');
    s+=`<circle cx="${J.head[0]}" cy="${J.head[1]}" r="9" class="hd"/>`;
  } else {
    if(J.knee2){s+=ln(J.hip,J.knee2,'b2')+ln(J.knee2,J.foot2,'b2')}
    s+=ln(J.hip,J.knee,'b')+ln(J.knee,J.foot,'b');
    if(!pat.nt) s+=ln(J.foot,[J.foot[0]+9,J.foot[1]],'b',5);
    s+=ln(J.hip,J.sh,'b')+ln(J.sh,J.el,'b')+ln(J.el,J.hand,'b');
    s+=`<circle cx="${J.head[0].toFixed(1)}" cy="${J.head[1].toFixed(1)}" r="9" class="hd"/>`;
  }
  // accessoires mobiles
  (pat.pr||[]).forEach(p=>{
    const h=J.hand;
    if(p==='plate') s+=`<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="11" class="pl"/>`;
    if(p==='plateHip') s+=`<circle cx="${J.hip[0].toFixed(1)}" cy="${(J.hip[1]-9).toFixed(1)}" r="11" class="pl"/>`;
    if(p==='barSh') s+=`<circle cx="${(J.sh[0]-11).toFixed(1)}" cy="${(J.sh[1]+3).toFixed(1)}" r="11" class="pl"/>`;
    if(p==='db') s+=ln([h[0]-7,h[1]],[h[0]+7,h[1]],'pl',4)+`<rect x="${(h[0]-10).toFixed(1)}" y="${(h[1]-5).toFixed(1)}" width="5" height="10" rx="1.5" fill="var(--ac)"/><rect x="${(h[0]+5).toFixed(1)}" y="${(h[1]-5).toFixed(1)}" width="5" height="10" rx="1.5" fill="var(--ac)"/>`;
    if(p==='dbF') [J.hR,J.hL].forEach(q=>{s+=`<rect x="${(q[0]-4).toFixed(1)}" y="${(q[1]-7).toFixed(1)}" width="8" height="14" rx="2" fill="var(--ac)"/>`});
    if(p==='handF') [J.hR,J.hL].forEach(q=>{s+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="5" fill="var(--ac)"/>`});
    if(p==='handle') s+=`<circle cx="${h[0].toFixed(1)}" cy="${h[1].toFixed(1)}" r="5" fill="var(--ac)"/>`;
    if(p==='barH') s+=ln([h[0]-16,h[1]],[h[0]+16,h[1]],'pl',4);
    if(p==='pad') s+=`<circle cx="${J.foot[0].toFixed(1)}" cy="${J.foot[1].toFixed(1)}" r="7" fill="var(--ac)"/>`;
    if(p==='toes') s+=ln(J.foot,[J.foot[0]+12,151],'b',5);
    if(p.fp!==undefined){const d=V(p.fp,20);s+=ln([J.foot[0]-d[0],J.foot[1]-d[1]],[J.foot[0]+d[0],J.foot[1]+d[1]],'pl',5)}
  });
  return s;
}
function figSVG(id,cls){const pk=EX[id].p, vb=PAT[pk].vb||'0 0 200 160'; return `<svg class="fig ${cls||''}" viewBox="${vb}" data-pat="${pk}">${drawPose(pk,0)}</svg>`}
let animEls=[];
function refreshAnims(){animEls=[...document.querySelectorAll('svg[data-pat]')]}
const PERIOD=2600;
function animLoop(ts){
  const e=(1-Math.cos(2*Math.PI*(ts%PERIOD)/PERIOD))/2;
  for(const el of animEls){ if(el.isConnected) el.innerHTML=drawPose(el.dataset.pat,e) }
  requestAnimationFrame(animLoop);
}

  // iOS 18+ : un interrupteur natif déclenche le moteur haptique ; ailleurs, vibration courte.
  try{ if(!hapEl){hapEl=document.createElement('label');hapEl.setAttribute('aria-hidden','true');hapEl.style.cssText='position:fixed;opacity:0;pointer-events:none;width:1px;height:1px;overflow:hidden';hapEl.innerHTML='<input type="checkbox" switch>';document.body.appendChild(hapEl)} hapEl.click() }catch(e){}

/* ---------- Bannière ---------- */
function toast(msg,icon='checkCircle',err){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d=document.createElement('div'); d.className='toast'+(err?' err':''); d.innerHTML=(icon?ic(icon,1):'')+'<span>'+esc(msg)+'</span>';
  document.body.appendChild(d); requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('show')));
  setTimeout(()=>{d.classList.remove('show');setTimeout(()=>d.remove(),500)},2300);
}
const toastErr=m=>toast(m,'xcircle',true);

function page(title,o,body){

}
const sec=(h,rows,f,big)=>`<section class="sec">${h?`<div class="sec-h${big?' big':''}">${h}</div>`:''}<div class="grp">${rows}</div>${f?`<div class="sec-f">${f}</div>`:''}</section>`;
function cell(o){
  const tag=o.a?'button':'div';
  return `<${tag} class="cell ${o.icon?'hasico':''} ${o.cls||''}" ${o.a?`data-a="${o.a}"`:''} ${o.attrs||''}>${o.icon?`<span class="cico" style="background:${o.bg||'var(--gray)'}">${o.icon}</span>`:''}<span class="cbody"><span class="ct">${o.title}</span>${o.sub?`<span class="cs">${o.sub}</span>`:''}</span>${o.value!=null?`<span class="cv ${o.vcls||''}">${o.value}</span>`:''}${o.right||''}${o.chev?CH:''}</${tag}>`;
}
function seg(key,opts,val,a){
  const i=Math.max(0,opts.findIndex(o=>String(o[0])===String(val)));
  return `<div class="segc" style="--n:${opts.length};--i:${i}"><span class="thumb"></span>${opts.map(([v,l])=>`<button data-a="${a||'setF'}" data-k="${key}" data-val="${v}" class="${String(v)===String(val)?'on':''}">${l}</button>`).join('')}</div>`;
}
function segUpdate(btn){
  const sc=btn.closest('.segc'); if(!sc) return false;
  const bs=[...sc.querySelectorAll('button')]; sc.style.setProperty('--i',bs.indexOf(btn));
  bs.forEach(b=>b.classList.toggle('on',b===btn)); return true;
}
function ringSVG(pct,label){
  const C=2*Math.PI*40;
  return `<svg class="ringsvg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(200,255,46,.16)" stroke-width="13"/>${pct>0?`<circle cx="50" cy="50" r="40" fill="none" stroke="var(--tint)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-Math.min(1,pct))).toFixed(1)}" transform="rotate(-90 50 50)"/>`:''}<text x="50" y="57" text-anchor="middle" font-size="21" font-weight="700" fill="#fff" font-family="ui-rounded,-apple-system,system-ui">${label}</text></svg>`;
}

let goTimer=null;
function tick(){
  const A=S.active; if(!A) return;
  const el=$('#elapsed'); if(el) el.textContent=fmtT((Date.now()-A.start)/1000);
  const R=A.rest; if(!R) return;
  const rem=(R.end-Date.now())/1000, t=$('#restT'), t2=$('#restT2'), ring=$('#ringFg'), mr=$('#miniRing');
  if(rem>0){
    const txt=fmtT(Math.ceil(rem)); if(t)t.textContent=txt; if(t2)t2.textContent=txt;
    if(ring) ring.setAttribute('stroke-dashoffset',(CIRC*(1-rem/R.total)).toFixed(1));
    if(mr) mr.setAttribute('stroke-dashoffset',(87.96*(1-rem/R.total)).toFixed(1));
  } else if(!R.fired){
    R.fired=true; save(); vibrate([300,120,300,120,300]); haptic();
    if(t)t.textContent='GO'; if(t2)t2.textContent='GO';
    const sub=$('#restSub'); if(sub) sub.textContent='C’est reparti !';
    if(ring) ring.setAttribute('stroke-dashoffset',CIRC.toFixed(1));
    const ov=$('#rest'); if(ov) ov.classList.add('go');
    const pill=$('#restPill'); if(pill) pill.classList.add('go');
    clearTimeout(goTimer);
    goTimer=setTimeout(()=>{ if(S.active&&S.active.rest&&S.active.rest.fired){S.active.rest=null;save();render()} },2600);
  } else if(R.fired&&Date.now()-R.end>4000){ A.rest=null; save(); render(); }
}

/* =========================================================
   PLANNING ADAPTATIF
   - Récupération par muscle : ~48 h après un volume modéré, ~72 h après ≥ 6 séries
     (l'ACSM recommande ~48 h entre deux séances intenses d'un même groupe musculaire).
   - La file des séances du cycle est réordonnée à chaque ouverture : priorité aux séances
     dont les muscles sont récupérés, qui ne chevauchent pas la précédente et qui rattrapent
     le volume en retard sur la semaine.
   ========================================================= */
function musOfDay(d){const o={};d.ex.forEach(x=>{const m=EX[x.id].m;o[m]=(o[m]||0)+nSets(x)});return o}
function musOfHist(h){const o={};h.ex.forEach(x=>{const e=EX[x.id];if(e)o[e.m]=(o[e.m]||0)+x.sets.length});return o}
function recovery(now){
  const r={}; Object.keys(MUS).forEach(m=>r[m]={v:1,h:null});
  S.history.forEach(h=>{const hrs=(now-h.d)/36e5; if(hrs>96) return; const ms=musOfHist(h);
    for(const m in ms){const v=Math.min(1,hrs/(ms[m]>=6?72:48)); if(v<r[m].v) r[m]={v,h:hrs}}});
  return r;
}
function readiness(d,rec){const ms=musOfDay(d);let t=0,a=0;for(const m in ms){t+=ms[m];a+=ms[m]*rec[m].v}return t?a/t:1}
function readyBadge(v){return v>=.85?['Prête','var(--green)']:v>=.6?['Récupération partielle','var(--orange)']:['Muscles encore fatigués','var(--red)']}
function weekSets(now){const o={};S.history.forEach(h=>{if(now-h.d<7*dayMs){const ms=musOfHist(h);for(const m in ms)o[m]=(o[m]||0)+ms[m]}});return o}
function weekTarget(){const o={};S.program.days.forEach(d=>{const ms=musOfDay(d);for(const m in ms)o[m]=(o[m]||0)+ms[m]});return o}
function overlap(a,b){const A=musOfDay(a),B=musOfDay(b);let o=0,t=0;for(const m in A){t+=A[m];if(B[m])o+=A[m]}return t?o/t:0}
function deficitScore(d,ws,tw){const ms=musOfDay(d);let s=0,t=0;for(const m in ms){s+=Math.min(ms[m],Math.max(0,(tw[m]||0)-(ws[m]||0)));t+=ms[m]}return t?s/t:0}
function ensureCycle(){
  if(!S.cycle||!Array.isArray(S.cycle.done)) S.cycle={done:[],skipped:[]};
  const n=S.program.days.length; S.cycle.done=S.cycle.done.filter(i=>i<n);
  if(S.cycle.done.length>=n){S.cycle.done=[];S.cycle.skipped=[]}
}
function planQueue(){
  ensureCycle();
  const days=S.program.days, now=Date.now(), rec=recovery(now), ws={...weekSets(now)}, tw=weekTarget();
  let rem=days.map((_,i)=>i).filter(i=>!S.cycle.done.includes(i)); const q=[];
  while(rem.length){
    let best=rem[0],bs=-1e9;
    rem.forEach((i,pos)=>{const d=days[i];
      const fresh=q.length===0?readiness(d,rec):1-overlap(d,days[q[q.length-1]]);
      const sc=fresh+0.35*deficitScore(d,ws,tw)-0.06*pos;
      if(sc>bs){bs=sc;best=i}});
    q.push(best); rem=rem.filter(i=>i!==best);
    const ms=musOfDay(days[best]); for(const m in ms) ws[m]=(ws[m]||0)+ms[m];
  }
  return q;
}
const nextIdx=()=>planQueue()[0];
function whyNext(i){
  const d=S.program.days[i], now=Date.now(), rec=recovery(now), ws=weekSets(now), tw=weekTarget(), ms=Object.keys(musOfDay(d));
  const tired=ms.filter(m=>rec[m].v<.85).map(m=>MUS[m].toLowerCase());
  const lag=ms.filter(m=>(ws[m]||0)<(tw[m]||0)*.5).map(m=>MUS[m].toLowerCase());
  if(tired.length){const t=tired.slice(0,2).join(' et ');return `${t.charAt(0).toUpperCase()+t.slice(1)} encore en récupération : tu peux changer de séance.`}
  if(lag.length&&S.history.length) return `Muscles récupérés · rattrape le volume de la semaine (${lag.slice(0,3).join(', ')}).`;
  return S.history.length?'Muscles récupérés · séance équilibrée avec le reste de ta semaine.':'Première séance du cycle.';
}
function lagGroups(){
  const now=Date.now(); if(S.history.filter(h=>now-h.d<7*dayMs).length<2) return [];
  const ws=weekSets(now), tw=weekTarget();
  return Object.entries(PRIO).filter(([g,o])=>{const t=o.m.reduce((a,m)=>a+(tw[m]||0),0), w=o.m.reduce((a,m)=>a+(ws[m]||0),0); return t>=6&&w<t*.5}).map(([g,o])=>o.n.toLowerCase());
}
function buildRappel(g){
  const p=S.profile, ms=PRIO[g].m, rank={C:0,I:1,A:1,H:2}; let ids=[];
  ms.forEach(m=>{const c=Object.keys(EX).filter(id=>EX[id].m===m&&fits(id,p)&&!(p.level==='deb'&&EX[id].u==='barre')).sort((a,b)=>rank[EX[a].t]-rank[EX[b].t]);
    ids.push(...c.slice(0,ms.length===1?3:(m==='fessiers'?1:2)))});
  _placeCtx=p.place||'gym'; const ex=ids.slice(0,5).map((id,i)=>{const x=prescribe(id,i,p);x.sets=Math.min(x.sets,3);return x}); _placeCtx=null;
  return {n:'Rappel '+PRIO[g].n.toLowerCase(),f:(p.place==='home'?'À la maison · ':'')+'Séance courte ciblée',place:p.place||'gym',ex};
}
function changeSheet(){

  const dayCell=i=>{const d=days[i],r=readiness(d,rec),[lb,col]=readyBadge(r);

function dayPlan(){
  const p=S.profile, M=macros(p), key=[p.goal,M.kcal,M.prot].join();
  if(_plan&&_plan.key===key) return _plan;
  const mac={}; RX.forEach(r=>mac[r.id]=rxMac(r));
  let best=null;
  const walk=(i,ids)=>{
    if(i===SLOTS.length){
      const t={kcal:0,p:0,c:0,f:0}; let off=0;
      ids.forEach(id=>{const m=mac[id];t.kcal+=m.kcal;t.p+=m.p;t.c+=m.c;t.f+=m.f; if(!rxOf(id).g.includes(p.goal)) off++});
      const k=Math.round(Math.min(1.6,Math.max(.6,M.kcal/t.kcal))*20)/20;
      const e=(v,tg,over)=>{const d=(v*k-tg)/tg;return d>0?d*over:-d};
      const ep=(()=>{const d=(t.p*k-M.prot)/M.prot;return d<0?-d*1.5:d<=.2?d*.3:.06+(d-.2)*1.5})();
      const sc=Math.abs(t.kcal*k-M.kcal)/M.kcal*2+ep+e(t.c,M.carb,1)+e(t.f,M.fat,1)+off*.15;
      if(!best||sc<best.sc) best={sc,ids:[...ids],k};
      return;
    }
    SLOTS[i][1].forEach(id=>{ if(!ids.includes(id)){ids.push(id);walk(i+1,ids);ids.pop()} });
  };
  walk(0,[]);
  const items=best.ids.map((id,i)=>({lbl:SLOTS[i][0],r:rxOf(id)}));
  const sum={kcal:0,p:0,c:0,f:0}; items.forEach(o=>{const m=rxMac(o.r,best.k);for(const x in sum)sum[x]+=m[x]});
  _plan={key,items,k:best.k,sum,M}; return _plan;
}

/* =========================================================
   MODE OMAD (One Meal A Day)
   - Les besoins du jour (kcal, P, G, L) ne changent pas : ils sont condensés dans un repas
     unique, ou dans un repas + un shaker densificateur.
   - Le repas est calculé : la source de protéines, de glucides et de lipides est dosée
     pour atteindre les cibles, autour d'aliments denses, cuits et digestes.
   - Bases : un apport de 100 g de protéines en une prise reste utilisé jusqu'à 12 h
     (Trommelen et al., 2023) ; la masse maigre est maintenue en alimentation restreinte
     dans le temps quand l'apport protéique est suffisant (Moro et al., 2016), mais un
     20/4 avec ~1 g/kg de protéines n'a pas permis de prendre du muscle (Tinsley et al., 2016).
   ========================================================= */
/* pr : protéine principale · pr2 : dessert lacté dosable (densificateur protéique)
   cb : féculent principal · cb2 : baguette (densificateur glucidique digeste) · ft : huile d'olive */
const OMAD_MENUS=[
 {id:'omad_saumon',n:'Saumon, riz & haricots verts',em:'🐟',pr:'saumon',pr2:'skyr',cb:'riz',fix:[['haricots_verts',150]],top:[['miel',15]]},
 {id:'omad_boeuf',n:'Bœuf, pâtes & brocolis',em:'🥩',pr:'boeuf5',pr2:'grec',cb:'pates',fix:[['brocoli',150]],top:[['fruits_rouges',100]]},
 {id:'omad_poulet',n:'Poulet, patate douce & épinards',em:'🍗',pr:'poulet',pr2:'skyr',cb:'patate_douce',fix:[['epinards',60]],top:[['dattes',30]]},
 {id:'omad_tofu',n:'Bowl tofu, quinoa & pois chiches',em:'🥗',pr:'tofu',pr2:'grec',cb:'quinoa',fix:[['pois_chiches',100],['concombre',80]],top:[['myrtilles',100]]},
];
const OMAD_SHAKE_BASE=[['whey',40],['lait',300],['avoine',50],['bcac',15]];
const CAP={pr:[100,350],pr2:[0,400],cb:[100,500],cb2:[0,250],ft:[0,50]};
const RX_DYN={};
function NUT(){ if(!S.nutri) S.nutri={omad:false,formula:'shake',meal:19,train:17,menu:'omad_saumon'}; return S.nutri }
const fmtH=h=>`${Math.floor(h)}:${h%1?'30':'00'}`;
function solveMenu(menu,T){
  const V={pr:menu.pr,pr2:menu.pr2,cb:menu.cb,cb2:'baguette',ft:'huile'}, q={pr:200,pr2:150,cb:250,cb2:0,ft:5};
  const fixed=[...menu.fix,...menu.top], fx={p:0,c:0,f:0}, MI={p:1,c:2,f:3};
  fixed.forEach(([id,g])=>{const v=ING[id].v;fx.p+=v[1]*g/100;fx.c+=v[2]*g/100;fx.f+=v[3]*g/100});
  const per=(k,m)=>ING[V[k]].v[MI[m]]/100, cl=(k,x)=>Math.max(CAP[k][0],Math.min(CAP[k][1],x));
  const others=(m,ex)=>{let o=fx[m];for(const k in q) if(!ex.includes(k)) o+=per(k,m)*q[k];return o};
  for(let it=0;it<100;it++){
    // protéines : source principale, puis dessert lacté si le plafond est atteint
    // (si la source principale est grasse, on la limite pour ne pas dépasser les lipides : le dessert lacté maigre complète)
    let need=T.p-others('p',['pr','pr2']); const prFat=(T.f-others('f',['pr','ft']))/per('pr','f');
    q.pr=cl('pr',Math.min(need/per('pr','p'),prFat)); q.pr2=cl('pr2',(need-per('pr','p')*q.pr)/per('pr2','p'));
    // glucides : féculent principal, puis baguette
    need=T.c-others('c',['cb','cb2']); q.cb=cl('cb',need/per('cb','c')); q.cb2=cl('cb2',(need-per('cb','c')*q.cb)/per('cb2','c'));
    // lipides : huile d'olive pour compléter
    q.ft=cl('ft',(T.f-others('f',['ft']))/per('ft','f'));
  }
  const R=(k,x)=>k==='ft'?Math.round(x):Math.round(x/10)*10;
  const out=[[V.pr,R('pr',q.pr)],[V.cb,R('cb',q.cb)],...menu.fix];
  if(q.cb2>=15) out.push(['baguette',R('cb2',q.cb2)]);
  if(q.ft>=2) out.push(['huile',R('ft',q.ft)]);
  if(q.pr2>=50) out.push([V.pr2,R('pr2',q.pr2)]);
  out.push(...menu.top);
  return out;
}
function omadTiming(){
  const n=NUT(), d=((n.meal-n.train)%24+24)%24;
  if(d>=1&&d<=3) return {lvl:'ok',t:'Repas placé après la séance',s:`Tu manges environ ${fmtNum(d)} h après le début de ta séance : récupération optimale et entraînement l’estomac léger.`,shakeWhen:'En fin de repas ou dans l’heure qui suit'};

  if(d>21) return {lvl:'bad',t:'Séance l’estomac plein',s:`Ta séance commence moins de ${fmtNum(24-d)} h après le repas : risque d’inconfort digestif. Place la séance avant le repas, ou au moins 3 h après.`,shakeWhen:'En fin de repas'};
  return {lvl:'warn',t:'Séance loin du repas',s:`${fmtNum(d)} h séparent la séance du repas. Choisis la formule « Repas + shaker » et prends le shaker juste après l’entraînement, ou rapproche le repas de la séance.`,shakeWhen:'Juste après la séance (rompt le jeûne, mais protège la récupération)'};
}

  const n=NUT(), M=macros(S.profile), menu=OMAD_MENUS.find(m=>m.id===n.menu)||OMAD_MENUS[0], tm=omadTiming();

/* ----- Scanner de code-barres (caméra) -----

const ZX_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
let _zxP=null, _scan=null;
function loadZX(){ if(window.ZXing) return Promise.resolve(window.ZXing); if(_zxP) return _zxP;

function zxReader(ZX){const h=new Map();h.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.EAN_8,ZX.BarcodeFormat.UPC_A,ZX.BarcodeFormat.UPC_E]);h.set(ZX.DecodeHintType.TRY_HARDER,true);return new ZX.BrowserMultiFormatReader(h,300)}

function offKcal(p){const n=p&&p.nutriments; if(!n) return null; const k=n['energy-kcal_100g']; if(k!=null&&k!=='') return +k; const kj=n['energy-kj_100g']??n['energy_100g']; return kj!=null&&kj!==''?Math.round(+kj/4.184):null}
const LIQ_RX=/\b(lait|jus|soda|cola|coca|boisson|eau|eaux|bi[eè]re|vin|sirop|smoothie|limonade|nectar|th[eé] glac[eé]|ice tea|energy|milk ?shake|k[eé]fir|lassi|cidre|champagne|whisky|vodka|rhum|pastis|caf[eé] frapp[eé]|latte|drink|shot)\b/i;
const isLiquidName=n=>LIQ_RX.test(n||'');
function offMap(p){
  const nm=(p.product_name_fr||p.product_name||'Produit').trim(), br=p.brands?p.brands.split(',')[0].trim():'';
  const qs=String(p.quantity||''), mq=qs.match(/(\d+(?:[.,]\d+)?)\s*(ml|cl|l)\b/i); let vol=0;

/* Sélection prête à afficher pour un produit (boisson : en ml, 1 canette/bouteille si format individuel) */

}
async function openScanner(){
  if(_scan) return;
  const ov=document.createElement('div'); ov.className='scan';
  ov.innerHTML=`<video id="scanV" playsinline muted autoplay></video><div class="scan-frame"><i></i><b></b></div>
    <div class="scan-top"><button class="tbtn" data-a="scanClose">Annuler</button></div>
    <div class="scan-bot"><div class="scan-msg" id="scanMsg">Ouverture de la caméra…</div><div class="scan-tip">Tiens le code-barres à l’horizontale, à 10–15 cm, dans le cadre.</div><button class="btn gray" data-a="scanPhoto">${ic('share')} Prendre une photo à la place</button></div>`;
  document.body.appendChild(ov); _scan={ov,stop:null,done:false,timer:null};
  const msg=t=>{const m=$('#scanMsg'); if(m) m.textContent=t};
  try{
    const v=$('#scanV'); v.setAttribute('playsinline',''); v.muted=true;
    const zxP=('BarcodeDetector' in window)?null:loadZX();

const OFF_F='product_name,product_name_fr,brands,nutriments,serving_quantity,code,quantity,product_quantity,product_quantity_unit,categories_tags';
async function offFetch(url){ const ac=new AbortController(), to=setTimeout(()=>ac.abort(),12000);

const OFF_ERR={rate:'Trop de recherches depuis ton réseau mobile (limite d’Open Food Facts, partagée avec d’autres abonnés). Réessaie dans une minute, en Wi-Fi, ou scanne le code-barres.',slow:'Open Food Facts met trop de temps à répondre. Réessaie dans un instant.',offline:'Pas de connexion : utilise les aliments, tes produits ou la saisie rapide.',http:'Open Food Facts ne répond pas : service saturé, ou limite de recherches atteinte sur ton réseau mobile. Réessaie dans une minute ou en Wi-Fi. Le scan de code-barres reste plus fiable.'};

async function offSearchRaw(q){

  if(!SW) return; const s=SW; SW=null; if(s.dir!=='h') return;
  _swBlock=Date.now(); s.c.style.transition=''; const x=s.base+s.dx;
  if(x<-s.w.offsetWidth*.55){ s.c.style.transform=`translateX(-${s.w.offsetWidth}px)`; swDelete(s.w); return }
  if(x<-40){ s.w.classList.add('open'); s.c.style.transform='translateX(-88px)' } else swClose(s.w);
});

    case 'lgDup': { const E=LG&&LG.edit; if(!E) break; const e=logOf(E.k).find(x=>x.id===E.id); if(!e) break; const {id,t,...c}=e; addLog(c,E.k); closeSheet(); render(); toast(`+${r1(e.kcal)} kcal ajoutées`); break; }
    case 'rxLog': { const r=rxOf(rxId), m=rxMac(r,rxK); addLog({meal:defMeal(),name:r.n,qty:`portion ×${fmtNum(rxK)}`,kcal:m.kcal,p:m.p,c:m.c,f:m.f,src:'rx'},todayK()); closeSheet(); render(); toast(`+${r1(m.kcal)} kcal ajoutées au journal`); break; }
    case 'omadToggle': {
      const n=NUT();
      if(n.omad){ n.omad=false; save(); render(); toast('Mode OMAD désactivé'); break; }
      el.classList.remove('on');
      actionSheet({title:'Activer le mode OMAD ?',msg:'Un seul repas par jour. Déconseillé avant 18 ans, pendant une grossesse, en cas de diabète, d’hypoglycémies, de troubles alimentaires ou de traitement pour la tension ou le cœur. Demande l’avis de ton médecin en cas de doute.',
        actions:[{label:'Activer le mode OMAD',style:'bold',fn:()=>{n.omad=true; if(S.profile.goal==='masse') n.formula='shake'; save(); if(view!=='nutrition') go('nutrition'); else render(); toast('Mode OMAD activé','clock')}}]});
      break; }
    case 'omadF': { NUT().formula=el.dataset.val; segUpdate(el); haptic(); save(); setTimeout(render,280); break; }
    case 'omadMenu': { NUT().menu=el.dataset.val; segUpdate(el); haptic(); save(); setTimeout(render,280); break; }
    case 'omadH': { const n=NUT(), k=el.dataset.k; n[k]=((n[k]+(+el.dataset.d)*.5)%24+24)%24; save(); render(); break; }
    case 'omadTips': omadTipsSheet(el.dataset.t); break;
    case 'histInfo': histSheet(+el.dataset.i); break;
    case 'validate': { unlockAudio(); const e=A.ex[A.cur], i=openIdx(e); if(i<0) return; e.sets[i].done=true; afterSet(e); break; }
    case 'toggle': { unlockAudio(); const e=A.ex[A.cur], s=e.sets[+el.dataset.i]; if(s.done){s.done=false;haptic();save();render()} else {s.done=true;afterSet(e)} break; }
    case 'adj': {
      const e=A.ex[A.cur], i=+el.dataset.i, s=e.sets[i], d=+el.dataset.d;
      if(el.dataset.f==='r') s.r=Math.max(0,s.r+d);
      else { s.w=Math.max(0,+(s.w+d*stepOf(e.id,s.w)).toFixed(1)); if(!s.done) e.sets.forEach((x,j)=>{if(j>i&&!x.done)x.w=s.w}); }
      save(); render(); break; }
    case 'goEx': { const i=+el.dataset.i; if(i!==A.cur) moveEx(i>A.cur?1:-1,i); break; }
    case 'nextEx': moveEx(1,nextOpen(A.cur)); break;
    case 'prevEx': moveEx(-1); break;
    case 'nextExNav': moveEx(1); break;
    case 'finish': finish(); break;
    case 'quit': go('home','fade'); toast('Séance gardée en cours','timer'); break;
    case 'finishAsk': {
      const tot=A.ex.reduce((x,e)=>x+e.sets.length,0), dn=A.ex.reduce((x,e)=>x+e.sets.filter(s=>s.done).length,0);
      actionSheet({title:'Terminer la séance ?',msg:`${dn} série${dn>1?'s':''} validée${dn>1?'s':''} sur ${tot}.`,actions:[
        {label:'Enregistrer et terminer',style:'bold',fn:finish},
        {label:'Abandonner sans enregistrer',style:'destructive',fn:abandon}]});
      break; }
    case 'swap': swapSheet(); break;
    case 'doSwap': { const e=A.ex[A.cur], nid=el.dataset.id, sg=suggest(nid), px=prescribe(nid,0,{...S.profile,place:A.place||'gym'}); e.id=nid; e.why=sg.why; e.rmin=px.rmin; e.rmax=px.rmax; e.rest=px.rest; e.sets.forEach(s=>{if(!s.done){s.w=sg.w;s.r=px.rmin}}); save(); closeSheet(); render(); toast('Exercice remplacé','swap'); break; }
    case 'restAdd': { const R=A.rest; if(!R) break; const d=+el.dataset.s; R.end+=d*1000; R.total=Math.max(5,R.total+d); R.fired=false; clearTimeout(goTimer);
      const rem=(R.end-Date.now())/1000; if(rem<=0) R.end=Date.now()+100; else scheduleBeeps(rem); const ov=$('#rest'); if(ov) ov.classList.remove('go'); haptic(); save(); tick(); break; }
    case 'restSkip': cancelBeeps(); clearTimeout(goTimer); A.rest=null; haptic(); save(); render(); break;
    case 'restMin': A.rest.min=true; save(); render(); break;
    case 'restExpand': if(A.rest){A.rest.min=false;save();render()} break;
    case 'toggleSet': { const k=el.dataset.k; S.settings[k]=!S.settings[k]; el.classList.toggle('on',S.settings[k]); save(); haptic(); break; }
    case 'testSound': unlockAudio(); if(actx){const t=actx.currentTime+.1;beepAt(t,660,.12,.35);beepAt(t+.4,990,.5,.5)} vibrate(200); haptic(); break;
    case 'delHist': { const i=+el.dataset.i; actionSheet({title:'Supprimer cette séance ?',msg:'Elle sera retirée de ton historique.',actions:[{label:'Supprimer la séance',style:'destructive',fn:()=>{S.history.splice(i,1);save();closeSheet();render();toast('Séance supprimée','trash')}}]}); break; }
    case 'export': {
      const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
      const u=URL.createObjectURL(blob), l=document.createElement('a'); l.href=u; l.download='coach-muscu-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),3000); break; }
    case 'import': $('#importFile').click(); break;
    case 'reset': actionSheet({title:'Tout réinitialiser ?',msg:'Profil, programme, historique, journal et photos seront effacés de ce téléphone.',actions:[{label:'Effacer toutes les données',style:'destructive',fn:()=>{localStorage.removeItem(KEY);localStorage.removeItem(PH_KEY);_ph=null;S=defState();F=null;obStep=0;go('onboard')}}]}); break;
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='fdQ'&&LG){ LG.q=ev.target.value; if(LG.nf){LG.nf=null; LG.offErr=null; const b=$('#lgBody'); if(b){b.innerHTML=lgBody(); const q=$('#fdQ'); if(q){q.focus(); q.setSelectionRange(q.value.length,q.value.length)}} return} fdRefresh(); }
  if(ev.target.id==='lgQtyIn'&&LG&&LG.sel){ const x=lgQtyParse(ev.target.value); if(x!=null){ LG.sel.qty=LG.sel.unit==='pc'?Math.round(x*100)/100:Math.round(x*10)/10; lgLive() } return; }
  if(ev.target.id==='dayName'&&EDIT!=null){ const d=S.program.days[EDIT], v=ev.target.value.trim(); if(d&&v){ d.n=v; d.edited=true; S.program.custom=true; save() } return; }
  if(ev.target.id==='libQ'&&LIB){ LIB.q=ev.target.value; const l=$('#libList'); if(l){l.innerHTML=libList();refreshAnims()} return; }
  if(ev.target.id==='npN'){ const z=$('#npSim'); if(z) z.innerHTML=npSimHTML(ev.target.value); if(LG&&!LG.nfUm) npUnit(isLiquidName(ev.target.value)?'ml':'g'); }
});
/* Au toucher, tout le chiffre est sélectionné : la frappe le remplace (le relâchement du doigt annule parfois la sélection, d'où le second select au clic) */
document.addEventListener('focusin',ev=>{ const e=ev.target; if(e.id!=='lgQtyIn') return; e.dataset.fresh='1'; setTimeout(()=>{try{e.select()}catch(_){}},0) });
document.addEventListener('click',ev=>{ const e=ev.target; if(e.id!=='lgQtyIn'||!e.dataset.fresh) return; delete e.dataset.fresh; try{e.select()}catch(_){} },true);
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.id==='lgQtyIn'){ ev.preventDefault(); ev.target.blur(); return; } if(ev.key==='Enter'&&ev.target.id==='fdQ'&&LG){ ev.preventDefault(); ev.target.blur(); LG.q=ev.target.value; offSearch(); } });
document.addEventListener('change',ev=>{
  if(ev.target.id==='scanFile'){ const f=ev.target.files[0]; if(f) scanPhotoFile(f); return; }
  if(ev.target.id==='lgQtyIn'&&LG&&LG.sel){ const s0=LG.sel, x=lgQtyParse(ev.target.value); if(x!=null) s0.qty=s0.unit==='pc'?Math.max(.25,Math.round(x*4)/4):Math.max(1,Math.round(x)); lgRefresh(); return; }
  if(ev.target.id==='phFile'){ const f=ev.target.files[0], k=ev.target.dataset.k; if(!f||!k) return;
    compressImg(f).then(url=>{ phAll()[k]=url; if(phSave()){ toast('Photo enregistrée'); figMode='mach'; if(_exCtx&&$('#sheet').classList.contains('open')) exInfo(_exCtx[0],_exCtx[1]); render(); } }).catch(()=>toastErr('Image illisible')); return; }
  if(ev.target.id!=='importFile') return;
  const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.v||!d.profile) throw 0; S=Object.assign(defState(),d); save(); toast('Sauvegarde importée'); go('home')}catch(e){toastErr('Fichier invalide')}}; r.readAsText(f);
});

/* ---------- Icône & manifeste générés (PWA mono-fichier) ---------- */
function setupPWA(){ /* icônes et manifeste déclarés en dur dans <head>
<!-- © 2026 Coach Muscu (teno-cmd). Tous droits réservés. Reproduction interdite sans autorisation (voir LICENSE). --> (fichiers PNG du dépôt) */
  /* Service worker : requis par Android (Samsung Internet notamment) pour proposer l'installation, et permet l'ouverture hors connexion. */
  if(!('serviceWorker' in navigator) || !(location.protocol==='https:'||location.hostname==='localhost')) return;
  const reg=()=>navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(document.readyState==='complete') reg(); else window.addEventListener('load',reg);
}

/* ---------- Tuto d'installation (détecte l'appareil et le navigateur) ---------- */
const INST_KEY='coachmuscu_install_seen';
let _bip=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();_bip=e;if($('#instBody'))$('#instBody').innerHTML=installBody()});
window.addEventListener('appinstalled',()=>{_bip=null;if($('#instBody'))closeSheet();toast('Coach Muscu est installée')});
const isStandalone=()=>!!(window.navigator.standalone||matchMedia('(display-mode: standalone)').matches);
function detectEnv(){
  const ua=navigator.userAgent||'';
  const ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const android=/Android/i.test(ua);
  const inApp=/FBAN|FBAV|Instagram|TikTok|Snapchat|Line\/|LinkedInApp|Twitter/i.test(ua);
  let br='other';
  if(ios) br=/CriOS/.test(ua)?'chrome':/FxiOS/.test(ua)?'firefox':/EdgiOS/.test(ua)?'edge':/OPiOS|OPT\//.test(ua)?'opera':'safari';
  else if(/SamsungBrowser/.test(ua)) br='samsung';
  else if(/Firefox/.test(ua)) br='firefox';
  else if(/Edg\//.test(ua)) br='edge';
  else if(/OPR\//.test(ua)) br='opera';
  else if(/Chrome\//.test(ua)) br='chrome';
  else if(/Safari\//.test(ua)) br='safari';
  return {os:ios?'ios':android?'android':'desktop', br, inApp};
}
const BR_N={safari:'Safari',chrome:'Chrome',firefox:'Firefox',edge:'Edge',opera:'Opera',samsung:'Samsung Internet',other:'ton navigateur'};
function installSteps(env){
  const {os,br,inApp}=env;
  if(inApp) return {lead:'Tu as ouvert le site depuis une autre appli (Instagram, TikTok…). Son navigateur intégré ne permet pas l’installation.',
    steps:[`Appuie sur le menu <b>⋯</b> en haut ou en bas de l’écran.`,`Choisis <b>« Ouvrir dans ${os==='ios'?'Safari':'le navigateur'} »</b>.`,'Le tuto s’affichera à nouveau, avec les étapes pour ce navigateur.']};
  if(os==='ios'){
    if(br==='safari') return {steps:[`Appuie sur le bouton <b>Partager</b> ${ic('share')} en bas de l’écran (en haut sur iPad).`,'Fais défiler et choisis <b>« Sur l’écran d’accueil »</b>.','Appuie sur <b>Ajouter</b> en haut à droite.']};
    return {steps:[`Appuie sur le bouton <b>Partager</b> ${ic('share')} ${br==='chrome'?'dans la barre d’adresse, en haut à droite':'du navigateur'}.`,'Choisis <b>« Ajouter à l’écran d’accueil »</b> (fais défiler si besoin).','Appuie sur <b>Ajouter</b>.'],
      foot:'Option absente ? Elle nécessite iOS 16.4 ou plus. Sinon, ouvre le site dans Safari.'};
  }
  if(os==='android'){
    if(br==='samsung') return {steps:['Appuie sur le menu <b>☰</b> en bas à droite.','Choisis <b>« Ajouter la page à »</b>.','Choisis <b>« Écran d’accueil »</b>, puis <b>Ajouter</b>.'],
      foot:'Une icône de téléchargement peut aussi apparaître directement dans la barre d’adresse : un appui suffit.'};
    if(br==='firefox') return {steps:['Appuie sur le menu <b>⋮</b>.','Choisis <b>« Installer »</b> ou <b>« Ajouter à l’écran d’accueil »</b>.','Confirme avec <b>Ajouter</b>.']};
    return {steps:['Appuie sur le menu <b>⋮</b> en haut à droite.','Choisis <b>« Installer l’application »</b> ou <b>« Ajouter à l’écran d’accueil »</b>.','Confirme avec <b>Installer</b>.']};
  }
  if(br==='chrome'||br==='edge'||br==='opera') return {steps:['Clique sur l’icône d’installation <b>⊕</b> à droite de la barre d’adresse.',`Ou passe par le menu <b>${br==='edge'?'⋯':'⋮'}</b> → <b>« Installer Coach Muscu »</b>${br==='chrome'?' (parfois dans « Caster, enregistrer et partager »)':''}.`,'Confirme avec <b>Installer</b>.']};
  if(br==='safari') return {steps:['Dans la barre de menus, ouvre <b>Fichier</b>.','Choisis <b>« Ajouter au Dock »</b> (macOS Sonoma ou plus).','Confirme avec <b>Ajouter</b>.']};
  return {lead:`${BR_N[br]} sur ordinateur ne permet pas d’installer les applis web.`,steps:['Ouvre le site dans <b>Chrome</b> ou <b>Edge</b> pour l’installer sur ton ordinateur.','Ou, mieux, ouvre-le sur ton téléphone : l’appli est pensée pour être utilisée à la salle.']};
}
function installBody(){
  const env=detectEnv(), dev={ios:/iPad/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)?'iPad':'iPhone',android:'Android',desktop:'ordinateur'}[env.os];
  if(isStandalone()) return `<div class="pad"><div class="hero-ic">${ic('checkCircle',1)}</div><h2 class="t2 center">L’appli est déjà installée</h2><div class="sub center mt">Tu l’utilises depuis ton écran d’accueil. 💪</div></div>`;
  const T=installSteps(env);
  const quick=_bip&&!env.inApp?`<div class="btnwrap"><button class="btn" data-a="installNow">${ic('down')} Installer en un appui</button></div><div class="sec-f" style="padding:0 20px 10px;margin-top:-22px">Ou suis les étapes ci-dessous.</div>`:'';
  return `<div class="pad"><div class="hero-ic">${ic('down')}</div><h2 class="t2 center">Installe Coach Muscu</h2>
     <div class="sub center mt">${T.lead||(env.os==='desktop'?'L’appli s’ouvrira dans sa propre fenêtre, comme un vrai logiciel, même sans connexion.':'L’appli s’ouvrira en plein écran depuis ton écran d’accueil, comme une vraie appli, même sans connexion.')}</div></div>
   ${quick}
   ${sec(`${dev} · ${env.inApp?'navigateur intégré':BR_N[env.br]}`,T.steps.map((t,i)=>`<div class="cell top"><span class="istep">${i+1}</span><span class="cbody"><span class="ct sm">${t}</span></span></div>`).join(''),T.foot||null)}
   <div class="btnwrap"><button class="btn gray" data-a="closeSheet">Plus tard</button></div>`;
}
function installGuide(){ try{localStorage.setItem(INST_KEY,'1')}catch(e){} openSheet(`<div id="instBody">${installBody()}</div>`,{title:'Installation'}) }
function maybeInstallGuide(){ if(isStandalone()) return; let seen=null; try{seen=localStorage.getItem(INST_KEY)}catch(e){} if(!seen) setTimeout(()=>{ if(!$('#sheet').classList.contains('open')&&!S.active) installGuide() },1200) }

/* ---------- Statistiques anonymes ----------
   Seuls un chemin (« / ») ou un nom d'action (« seance-terminee ») partent vers GoatCounter :
   jamais le profil, le poids, les séances ou les repas. */
function stat(path,title,isEv){
  if(!STATS.code||S.settings.noStats||!/^https:$/.test(location.protocol)) return;
  try{ const q=new URLSearchParams({p:path,t:title||path}); if(isEv) q.set('e','true');
    if(!isEv&&screen&&screen.width) q.set('s',screen.width+','+screen.height+','+(window.devicePixelRatio||1));
    q.set('rnd',Math.random().toString(36).slice(2,8));
    new Image().src=`https://${STATS.code}.goatcounter.com/count?${q}`; }catch(e){}
}
const track=(name,title)=>stat(name,title||name,true);
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]'); if(!a) return; const h=a.href;
  if(/amazon\.fr/.test(h)) track('lien-amazon','Clic sur un lien Amazon'); else if(/decathlon\.fr/.test(h)) track('lien-decathlon','Clic sur un lien Decathlon'); else if(MONEY.support.url&&h.startsWith(MONEY.support.url)) track('lien-don','Clic sur le lien de don')},true);

/* ---------- Démarrage ---------- */
if(S.profile && !S.program){S.program=generate(S.profile);save()}
if(S.profile && !S.profile.prio){S.profile.prio=[]}
if(S.profile && !S.profile.place){Object.assign(S.profile,{place:'gym',equip:[],hmax:20,kbmax:16})}
if(S.profile && !S.profile.chain){Object.assign(S.profile,{chain:'onair',noMach:S.profile.noMach||[]})}
if(S.program) ensureCycle();
setupPWA();
render();
stat('/',isStandalone()?'Ouverture (appli installée)':'Ouverture (navigateur)'); if(isStandalone()) track('ouverture-appli-installee','Ouverture depuis l’écran d’accueil');
maybeInstallGuide();
setTimeout(()=>{ if(S.profile) loadCiq() },4000);
setInterval(tick,250);
requestAnimationFrame(animLoop);
if(S.active) keepAwake();
</script>
